*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand-dk)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,label.choice:focus-within{outline:3px solid var(--gold);outline-offset:2px}

/* the green gradient used on the Division slides */
.greenband{background:linear-gradient(115deg,var(--brand-dk) 0%,#0B6B35 55%,var(--brand-hi) 100%);color:var(--on-brand)}

header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--gold)}
header.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.12rem;display:flex;align-items:center;gap:10px;color:var(--on-brand);text-decoration:none}
header.bar nav{display:flex;gap:4px;margin-left:auto}
header.bar nav a{font-weight:700;font-size:.92rem;color:var(--on-brand);text-decoration:none;padding:6px 12px;border-radius:999px}
header.bar nav a:hover{background:rgba(255,255,255,.14)}
header.bar nav a[aria-current="page"]{background:var(--gold);color:#231A00}

main{padding-block:24px 56px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5.6vw,3.2rem);font-weight:800;letter-spacing:-.015em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.18rem;font-weight:700}
h4,.h4{font-size:.78rem;font-family:var(--f-mono);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:68ch}
ul,ol{margin:0;padding-left:1.25em}
li{margin-block:2px}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.o{text-decoration:overline;text-decoration-thickness:1.5px}
.f{font-family:var(--f-mono);background:var(--a-tint);border-radius:4px;padding:1px 6px;white-space:nowrap}
.view{display:flex;flex-direction:column;gap:28px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{font:inherit;font-weight:700;font-size:.92rem;border:2px solid var(--accent);background:var(--sheet);color:var(--accent);padding:6px 14px;border-radius:999px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{background:var(--a-tint)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#231A00}
.btn.sm{font-size:.85rem;padding:3px 12px}

/* banners: green gradient + woven band on the left + gold rule */
.banner{position:relative;border-radius:10px;overflow:hidden;padding:24px 24px 22px 52px;display:flex;flex-direction:column;gap:10px;border-bottom:4px solid var(--gold)}
.banner::before{content:"";position:absolute;inset:0 auto 0 0;width:22px;background:var(--weave);background-size:22px 22px;border-right:3px solid var(--gold)}
.banner .eyebrow{color:var(--gold);font-weight:600}
.banner p{color:rgba(255,255,255,.88)}
.banner .gold-text{color:var(--gold)}
.weave-strip{height:12px;background:var(--weave);background-size:12px 12px;border-radius:2px}

/* term map */
.map{background:var(--sheet);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:10px;padding:14px 14px 12px}
.map-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.map-art{display:block;width:100%;height:52px}
.map-art *{fill:none;stroke-width:2.5;vector-effect:non-scaling-stroke}
.art-geo,.art-geo-d{stroke:var(--geo);stroke-linejoin:round}
.art-geo-d{stroke-dasharray:4 5;stroke-width:1.5}
.art-alg{stroke:var(--alg);stroke-linecap:round}
.ticks{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.ticks li{margin:0;min-width:0}
.tick{position:relative;height:100%;display:flex;flex-direction:column;align-items:stretch;text-align:center;gap:2px;text-decoration:none;color:var(--ink);padding:8px 2px 6px;border-radius:6px;border-top:5px solid var(--geo)}
.tick.alg{border-top-color:var(--alg)}
.tick:hover{background:var(--a-tint)}
.tn{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1}
.ts{display:block;width:100%;font-size:.68rem;line-height:1.2;color:var(--muted);overflow-wrap:normal;hyphens:manual}
.tick.now{background:var(--gold);color:#231A00}
.tick.now .ts{color:#231A00}
.tick.next{box-shadow:inset 0 0 0 2px var(--gold)}
.flag{font-family:var(--f-mono);font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.bands{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.band{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.04em;padding:3px 8px;border-radius:4px;color:#FFFFFF}
.band.geo{background:#0B6B35} .band.alg{background:#1D4ED8}
@media (max-width:560px){.ts{display:none}.tn{font-size:1.1rem}.banner{padding-left:44px}}

/* panels */
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.panel-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end}
.panel-head>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.panel-head .eyebrow{color:var(--red);font-weight:600}
.nextup{border-top:4px solid var(--alg)}
.nextup.geo{border-top-color:var(--geo)}
.study{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}
.study-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.chip{margin:0;border:1px solid var(--line);background:var(--a-tint);border-radius:999px;padding:1px 10px;font-size:.88rem}

.how{display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:auto 1fr;column-gap:12px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:0}
.steps li::before{content:counter(s);grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--brand);color:var(--on-accent);font-family:var(--f-display);font-weight:800}
.steps li span{color:var(--muted);font-size:.93rem}

.weeks{display:flex;flex-direction:column;gap:12px}
.strand-h{font-size:1rem;display:flex;align-items:center;gap:8px;margin-top:6px}
.strand-h::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--geo)}
.strand-h.alg::before{background:var(--alg)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.wcard{display:flex;flex-direction:column;gap:6px;background:var(--sheet);border:1px solid var(--line);border-left:5px solid var(--geo);border-radius:8px;padding:12px 14px;text-decoration:none;color:var(--ink);min-width:0}
.wcard.alg{border-left-color:var(--alg)}
.wcard:hover{border-color:var(--ink);border-left-color:var(--gold)}
.wnum{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:600}
.wtitle{font-family:var(--f-display);font-weight:700;font-size:1.04rem;line-height:1.22}
.wmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;margin-top:auto}
.pill{font-size:.75rem;font-weight:700;padding:1px 10px;border-radius:999px;border:1.5px solid currentColor}
.pill.st-ready{background:var(--brand);border-color:var(--brand);color:var(--on-accent)}
.pill.st-study{color:var(--muted)} .pill.score{color:var(--alg)}

/* week page */
.week.alg{--accent:var(--alg)}
.back{font-weight:700;text-decoration:none;align-self:flex-start}
.comp{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:16px}
.comp ol{list-style:none;padding:0;display:flex;flex-direction:column;gap:10px}
.comp li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;margin:0}
.comp .cn{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--geo);color:#fff;font-family:var(--f-display);font-weight:800}
.comp li:nth-child(2) .cn{background:#1D4ED8}
.comp .cl{display:block;font-size:.8rem;font-weight:700;color:var(--red)}
.parts{display:flex;flex-wrap:wrap;gap:6px}
.part{font:inherit;font-size:.88rem;font-weight:700;display:inline-flex;gap:8px;align-items:center;background:var(--sheet);border:1.5px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;color:var(--ink);cursor:pointer}
.part span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.75rem}
.part:hover{border-color:var(--accent)}
.block{display:flex;flex-direction:column;gap:16px;scroll-margin-top:84px}
.block>h2{display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--gold)}
.sn{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--on-accent);font-size:1.05rem}
.block>.study{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px}
.soon{background:var(--sheet);border:1.5px dashed var(--line);border-radius:10px;padding:18px}

.lesson{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:84px}
.lesson-head{display:flex;gap:12px;align-items:center}
.lesson-num{font-family:var(--f-mono);font-weight:600;font-size:.85rem;padding:2px 10px;border-radius:999px;background:var(--accent);color:var(--on-accent)}
.video{display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:10px;border:1.5px dashed var(--line);background:var(--paper);color:var(--ink);text-decoration:none}
.video b{display:block;font-size:.95rem}.video small{color:var(--muted);font-size:.85rem}
.video.ready{border-style:solid;border-color:var(--accent)}
.play{flex:none;width:38px;height:38px;border-radius:50%;background:var(--grid);position:relative}
.play::after{content:"";position:absolute;left:15px;top:11px;border-left:12px solid var(--muted);border-top:8px solid transparent;border-bottom:8px solid transparent}
.video.ready .play{background:var(--accent)}.video.ready .play::after{border-left-color:var(--on-accent)}
.key{background:var(--a-tint);border-left:5px solid var(--brand);border-radius:0 8px 8px 0;padding:10px 14px;font-size:1.03rem}
.key b{color:var(--red)}
.lesson-body{display:flex;flex-direction:column;gap:16px}
.points{display:flex;flex-direction:column;gap:10px}
.figwrap:empty{display:none}
.fig{display:block;width:100%;max-width:560px;height:auto;margin-inline:auto}
.fig .shape *{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .diag line{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.fig .mark path,.fig .accent path{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}
.fig .accent path{stroke:var(--red);stroke-width:2.5}
.fig .right{fill:none;stroke:var(--ink);stroke-width:1.5}
.fig .mid{stroke:var(--red);stroke-width:3;stroke-dasharray:8 5}
.fig .box{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 4}
.fig .lbl{font-family:var(--f-display);font-weight:700;font-size:20px;fill:var(--ink)}
.fig .lbl.sm{font-size:16px}
.fig .cap{font-family:var(--f-mono);font-size:14px;fill:var(--muted)}
.fig .cap.strong{fill:var(--red);font-weight:600}
.example{border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.example .eyebrow{padding:8px 16px 0;color:var(--red);font-weight:600}
.example .q{background:var(--q-tint);margin:8px 0 0;padding:10px 16px;max-width:none}
.example ol{font-family:var(--f-mono);font-size:.92rem;background:var(--a-tint);padding:10px 16px 12px 2.4em}
.q{font-weight:700}

.explore{border:2px solid var(--accent);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sheet)}
.explore-head{display:flex;flex-direction:column;gap:2px}
.explore-head .eyebrow{color:var(--red);font-weight:600}
.explore .fig{max-width:340px}
.sliders{display:grid;grid-template-columns:1fr;gap:4px 16px}
@media (min-width:620px){.sliders{grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:auto auto}}
.sliders label{font-size:.92rem;font-weight:700}
.sliders output{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
.result{font-family:var(--f-mono);font-size:.95rem;background:var(--a-tint);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.sort-item{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
/* Weeks 3-7: geometry marks, coordinate planes, tiles, proofs */
.fig.wide{max-width:680px}
.explore .fig.wide{max-width:560px}
.fig .tri,.fig .plane{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .ln{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}
.fig .ln.dash{stroke:var(--muted);stroke-dasharray:6 5}
.fig .acc{stroke:var(--red);stroke-width:4;fill:none;stroke-linecap:round}
.fig .tk{stroke:var(--ink);stroke-width:2}
.fig .am{fill:none;stroke:var(--ink);stroke-width:1.8}
.fig .am.hot{stroke:var(--red);stroke-width:2.6}
.fig .ink,.fig .pt{fill:var(--ink)}
.fig .pt.hot{fill:var(--red)}
.fig .lbl.xs{font-size:14px}
.fig .tile{fill:color-mix(in srgb,var(--accent) 16%,transparent);stroke:var(--ink);stroke-width:2}
.fig .tile.miss{fill:color-mix(in srgb,var(--gold) 34%,transparent);stroke-dasharray:6 4}
.fig .gl{stroke:var(--grid);stroke-width:1}
.fig .ax{stroke:var(--muted);stroke-width:1.6}
.fig .num{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.fig .curve{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.fig .parent{fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 5}
.fig .axis-sym{stroke:var(--red);stroke-width:1.6;stroke-dasharray:6 5}
@media (min-width:620px){.sliders.s3{grid-template-columns:1fr 1fr 1fr}}
.proof{border-collapse:collapse;width:100%;max-width:640px;font-size:.95rem}
.proof caption{caption-side:top;text-align:left;font-weight:700;padding-bottom:6px}
.proof th{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;text-align:left;color:var(--on-accent);background:var(--accent);padding:6px 10px}
.proof td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
.proof tr:nth-child(even) td{background:var(--a-tint)}
.proof td:first-child{width:55%}
.note{background:var(--sheet);border:1.5px dashed var(--brand);border-radius:10px;padding:12px 16px;max-width:none}

.level{display:flex;flex-direction:column;gap:10px}
.lv{display:inline-block;padding:2px 12px;border-radius:999px;color:#fff;background:var(--good);letter-spacing:.06em}
.lv-average{background:#B7791F} .lv-difficult{background:#C00000}
.prob{display:flex;flex-direction:column;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:0 0 14px;overflow:hidden}
.prob>*:not(.q){margin-inline:16px}
.prob>.q{background:var(--q-tint);padding:10px 16px;max-width:none}
.study .prob{border-style:dashed}
.answer-row{display:flex;align-items:center;gap:8px}
.ans{font:inherit;font-family:var(--f-mono);font-size:1rem;width:9em;max-width:100%;padding:6px 10px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.ans:focus{border-color:var(--accent)}
.unit{font-family:var(--f-mono);color:var(--muted)}
.fb{font-weight:700;min-height:1.2em}
.fb:empty{min-height:0}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.sol{font-family:var(--f-mono);font-size:.92rem;color:var(--ink);background:var(--a-tint);border-radius:8px;padding:8px 12px;white-space:pre-wrap}

.choices{display:flex;flex-direction:column;gap:6px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--sheet)}
.choice:hover{border-color:var(--accent)}
.choice input{margin-top:5px;accent-color:var(--accent)}
.check{display:flex;flex-direction:column;gap:12px}
.check-item{border:1px solid var(--line);border-radius:10px;background:var(--sheet);padding:14px 16px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.check-item legend{float:left;width:100%;font-weight:700;display:flex;gap:10px;padding:0}
.check-item legend + *{clear:both}
.qn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-family:var(--f-mono);font-size:.85rem}
.check-item.right{border-color:var(--good);box-shadow:inset 5px 0 0 var(--good)}
.check-item.wrong{border-color:var(--bad);box-shadow:inset 5px 0 0 var(--bad)}
.check-item.wrong .choice.is-answer,.check-item.right .choice.is-answer{border-color:var(--good);background:var(--a-tint)}
.next{background:var(--sheet);border:2px solid var(--brand);border-top:5px solid var(--gold);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.next .eyebrow{color:var(--red);font-weight:600}

.lights{display:flex;flex-direction:column;gap:8px;max-width:480px}
.light{font:inherit;display:flex;gap:12px;align-items:center;text-align:left;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--sheet);color:var(--ink);cursor:pointer}
.light:hover{border-color:var(--accent)}
.light.on{border:2px solid var(--brand);font-weight:700;background:var(--a-tint)}
.dot{flex:none;width:18px;height:18px;border-radius:50%}
.dot-green{background:#15803D} .dot-yellow{background:#F2B705} .dot-red{background:#C00000}
.pager{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:16px}
footer.site{border-top:3px solid var(--gold)}
footer.site .wrap{display:flex;flex-direction:column;gap:10px;padding-block:18px 26px;font-size:.85rem}
footer.site p{max-width:none;color:rgba(255,255,255,.88)}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}

/* ---------- Version 1.1 additions ---------- */
.skip-link{position:absolute;left:12px;top:-60px;z-index:20;background:var(--gold);color:#231A00;font-weight:700;padding:10px 16px;border-radius:0 0 10px 10px;text-decoration:none}
.skip-link:focus{top:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
main:focus{outline:none}
h1:focus,h2:focus,.lesson:focus,.next:focus{outline:3px solid var(--gold);outline-offset:4px}
.brand img{border-radius:6px;display:block}
.small{font-size:.88rem}
ul.plain{display:flex;flex-direction:column;gap:6px}
.banner-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.banner-text{display:flex;flex-direction:column;gap:8px;flex:1 1 280px;min-width:0}
.seal{flex:none;width:104px;height:auto;background:#fff;border-radius:50%;padding:4px;box-shadow:0 0 0 3px var(--gold)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:6px 0 0}
.facts div{background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);border-radius:8px;padding:6px 10px}
.facts dt{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.facts dd{margin:0;font-weight:700;color:#fff}
.lesson-links{display:flex;flex-direction:column;gap:4px}
.lesson-links a{font-weight:700}
.pill.vid{color:var(--alg)}
.wcard.now{box-shadow:0 0 0 3px var(--gold)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.danger:hover{background:color-mix(in srgb,var(--red) 10%,var(--sheet))}
.privacy{border-top:4px solid var(--gold)}
.offline{border-top:4px solid var(--brand)}
.video{align-items:flex-start}
.video.none{border-style:dashed}
.vlist{margin:4px 0;padding-left:1.1em}
.vlist a{font-weight:700}
/* tables in lessons */
.tbl-wrap{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tov,.ctable{border-collapse:collapse;font-size:.95rem;margin:2px 0}
.tov caption,.ctable caption{caption-side:top;text-align:left;font-weight:700;padding-bottom:6px;font-family:var(--f-body)}
.tov th,.tov td{border:1.5px solid var(--line);padding:6px 12px;text-align:center;font-family:var(--f-mono);background:var(--sheet);color:var(--ink);min-width:2.8em}
.tov th{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.tov tr:last-child td{background:var(--a-tint);font-weight:600}
.ctable{width:100%;max-width:720px}
.ctable thead th{font-family:var(--f-body);font-size:.85rem;font-weight:700;text-align:left;color:var(--on-accent);background:var(--accent);padding:6px 10px}
.ctable tbody th{text-align:left;font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ctable td{border-bottom:1px solid var(--line);padding:6px 10px;vertical-align:top}
.ctable tbody tr:nth-child(even) th,.ctable tbody tr:nth-child(even) td{background:var(--a-tint)}
.example ol .tbl-wrap{margin:6px 0}
/* answers */
.answer-row{flex-wrap:wrap}
.ans-label{font-weight:700;font-size:.9rem}
/* reflection */
.reflect{display:flex;flex-direction:column;gap:14px}
.reflect fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 16px 16px;margin:0;background:var(--sheet);display:flex;flex-direction:column;gap:6px;min-width:0}
.reflect legend{font-weight:700;padding:0 6px}
.reflect label[for]{font-weight:700;font-size:.95rem;margin-top:6px}
.reflect textarea{font:inherit;font-size:1rem;width:100%;max-width:640px;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);resize:vertical}
.reflect textarea:focus{border-color:var(--accent);outline:3px solid var(--gold);outline-offset:1px}
.lights{max-width:none}
.light{cursor:pointer;max-width:480px}
.light input{accent-color:var(--brand);width:18px;height:18px;margin:0}
.light:has(input:checked){border:2px solid var(--brand);font-weight:700;background:var(--a-tint)}
.light:focus-within{outline:3px solid var(--gold);outline-offset:2px}
@media (max-width:560px){.seal{width:76px}.banner-row{gap:12px}}

/* ---------- Version 1.2: interactives ---------- */
.ix .result.good{background:color-mix(in srgb,var(--good) 14%,var(--sheet));border-left:4px solid var(--good)}
.ix .result.bad{background:color-mix(in srgb,var(--warn) 14%,var(--sheet));border-left:4px solid var(--warn)}
.ix .result:empty{display:none}
.ix .sl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ix .sliders{display:grid;grid-template-columns:1fr;grid-auto-flow:row;grid-template-rows:none;gap:8px 16px}
@media (min-width:620px){.ix .sliders{grid-template-columns:repeat(2,1fr)}.ix .sliders.s3{grid-template-columns:repeat(3,1fr)}.ix .sliders.hl4{grid-template-columns:repeat(2,1fr)}}
.ix .sliders label{font-size:.9rem;font-weight:700}
.ix .row{gap:8px 10px}
.ix select{font:inherit;font-size:.95rem;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);max-width:100%}
.ix select:focus{border-color:var(--accent)}
.nin{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.92rem}
.nin input,.ix-tov input{font:inherit;font-family:var(--f-mono);font-size:1rem;padding:5px 8px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.ix-tov input{width:3.6em;text-align:center;padding:4px}
.ix input.ok,.ix select.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--sheet))}
.ix input.no,.ix select.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--sheet))}
.ix .tov td{padding:4px 6px}
.seg{border:0;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;cursor:pointer;background:var(--sheet)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--a-tint)}
.seg input{accent-color:var(--accent)}
.kstep{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.kstep>b{flex-basis:100%}
.kstep textarea{font:inherit;width:100%;padding:6px 8px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink)}
.kstep label[for]{font-weight:700;font-size:.9rem}
.kf-steps{display:flex;flex-direction:column;gap:8px}
.steps-list{font-family:var(--f-mono);font-size:.92rem;background:var(--a-tint);border-radius:8px;padding:10px 16px 12px 2.4em;display:flex;flex-direction:column;gap:4px}
.sentence{font-size:1.02rem;line-height:2.1}
.center{text-align:center;margin-inline:auto}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted)}
.lg{display:inline-block;width:22px;height:5px;border-radius:3px}
.lg.dec{background:#C2410C}.lg.inc{background:var(--alg)}
.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match-cols>div{display:flex;flex-direction:column;gap:6px}
.mbtn{font:inherit;font-family:var(--f-mono);font-size:.9rem;text-align:left;padding:8px 10px;border:2px solid var(--line);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer}
.mbtn:hover{border-color:var(--accent)}
.mbtn[aria-pressed="true"]{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 20%,var(--sheet))}
.mbtn.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,var(--sheet));cursor:default;opacity:.8}
/* graph marks */
.fig .target{fill:none;stroke:var(--gold);stroke-width:3;stroke-dasharray:7 6}
.fig .curve.dec{stroke:#C2410C}
.fig .curve.inc{stroke:var(--alg)}
.fig .pt.zero{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.fig .pt.mir1{fill:var(--alg)}.fig .pt.mir2{fill:var(--gold);stroke:var(--ink);stroke-width:1.5}
.fig .pt.ctr{fill:#7C3AED}
.fig .segs{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 4}
.fig .acc-poly{fill:none;stroke:var(--red);stroke-width:2.6;stroke-linecap:round}
.fig .tri-poly{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .mid-poly{fill:none;stroke:var(--red);stroke-width:3;stroke-dasharray:8 5}
.fig polyline.ln{fill:none}
.fig .tile.filled{fill:color-mix(in srgb,var(--good) 30%,transparent);stroke-dasharray:none}
.fig .lbl.sm{font-size:16px}
@media (max-width:560px){.mbtn{font-size:.8rem;padding:6px 7px}.match-cols{gap:6px}}

/* 5.1 triangle centers: one color per kind of line and its center */
.fig .cl{fill:none;stroke-width:2;stroke-linecap:round}
.fig .cl.dash{stroke-width:1.6;stroke-dasharray:5 4}
.fig .cl.thin{stroke-width:1.4}
.fig .cl.cm,.fig .circ.cm{stroke:var(--c-med)}.fig .cl.co{stroke:var(--c-alt)}.fig .cl.ci,.fig .circ.ci{stroke:var(--c-bis)}.fig .cl.cc,.fig .circ.cc{stroke:var(--c-pb)}
.fig .circ{fill:none;stroke-width:2.2}
.fig .pt.cm{fill:var(--c-med)}.fig .pt.co{fill:var(--c-alt)}.fig .pt.ci{fill:var(--c-bis)}.fig .pt.cc{fill:var(--c-pb)}
.fig .pt.cm,.fig .pt.co,.fig .pt.ci,.fig .pt.cc{stroke:var(--sheet);stroke-width:1.5}
.fig .cap.strong.tcm{fill:var(--c-med)}.fig .cap.strong.tco{fill:var(--c-alt)}.fig .cap.strong.tci{fill:var(--c-bis)}.fig .cap.strong.tcc{fill:var(--c-pb)}
.fig .euler{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-dasharray:10 5}
.fig .num.ang{font-size:12px;font-weight:700;fill:var(--ink)}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;flex:none}
.sw.cm{background:var(--c-med)}.sw.co{background:var(--c-alt)}.sw.ci{background:var(--c-bis)}.sw.cc{background:var(--c-pb)}
.ctr-pick legend{font-weight:700;font-size:.9rem;margin-bottom:6px;padding:0}
.ix .opts{gap:6px 16px}.ix .opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.fig .num.ang,.fig .cap.strong.tcm,.fig .cap.strong.tco,.fig .cap.strong.tci,.fig .cap.strong.tcc{paint-order:stroke;stroke:var(--sheet);stroke-width:4px;stroke-linejoin:round}
.fig .pt.pulse{transform-box:fill-box;transform-origin:center;animation:ctrpulse .7s ease-in-out 2}
@keyframes ctrpulse{50%{transform:scale(2)}}
@media (prefers-reduced-motion:reduce){.fig .pt.pulse{animation:none}}

/* "New here? How to use the hub" panel */
.howto{gap:0;border:2px solid var(--gold);background:color-mix(in srgb,var(--gold) 7%,var(--sheet))}
.howto summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.howto summary::-webkit-details-marker{display:none}
.howto summary .eyebrow{color:var(--red);font-weight:600}
.howto-title{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.howto-hint::after{content:"Show the steps ▾";font-size:.85rem;font-weight:700;color:var(--accent);margin-left:auto}
.howto[open] .howto-hint::after{content:"Hide ▴"}
.howto summary:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:4px}
.howto-body{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.howto-steps{margin:0;padding:0;list-style:none;counter-reset:h;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
.howto-steps li{counter-increment:h;position:relative;padding:10px 12px 10px 52px;background:var(--sheet);border:1px solid var(--line);border-radius:10px;margin:0}
.howto-steps li::before{content:counter(h);position:absolute;left:12px;top:10px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--brand);color:var(--on-accent);font-family:var(--f-display);font-weight:800}
.howto-tips{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.95rem}

</style>
</head>

<script>
// =====================================================================
// SITE SETTINGS
// =====================================================================
// The site picks "This week" by itself from today's date and the
// schedule below. From Saturday on, it already shows the coming week.
//
// Classes moved or suspended?
//   - Change that week's dates in `schedule`, or
//   - Put a number in `currentWeek` (for example 8) to choose the week
//     yourself. Put "auto" back when the schedule is right again.
// Also change `lastUpdated` whenever you upload a new version.
// =====================================================================

window.SITE = {
  school: "Siay National High School",
  place: "Siay, Zamboanga Sibugay",
  grade: "Grade 9",
  subject: "Mathematics 9",
  schoolYear: "2026–2027",
  term: "Term 2",
  currentWeek: "auto",
  lastUpdated: "November 7, 2026",
  teacher: "Jomar B. Siarez",
  version: "1.4",
  // First and last class day of each week (year-month-day).
  schedule: {
    2: ["2026-09-24", "2026-09-30"],
    3: ["2026-09-30", "2026-10-06"],
    4: ["2026-10-12", "2026-10-15"],
    5: ["2026-10-19", "2026-10-22"],
    6: ["2026-10-26", "2026-10-29"],
    7: ["2026-11-03", "2026-11-05"],
    8: ["2026-11-09", "2026-11-12"]
  }
};

// Lesson files add themselves to this list.
window.HUB = { weeks: [] };

// ---------- week from the date (no need to edit below) ----------
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function scheduleDates(n) {
  const r = SITE.schedule[n]; if (!r) return "";
  const a = parseDay(r[0]), b = parseDay(r[1]);
  return a.getMonth() === b.getMonth() ? `${MONTHS[a.getMonth()]} ${a.getDate()}–${b.getDate()}`
    : `${MONTHS[a.getMonth()]} ${a.getDate()}–${MONTHS[b.getMonth()]} ${b.getDate()}`;
}
function currentWeekNo(today = new Date()) {
  if (typeof SITE.currentWeek === "number") return SITE.currentWeek;
  const look = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 2);
  let best = null;
  Object.entries(SITE.schedule).forEach(([n, r]) => { if (parseDay(r[0]) <= look && (best === null || +n > best)) best = +n; });
  return best || 1;
}

<script>
// Small helpers shared by the lesson files and the site scripts.

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));

// Segment name with a bar over it, e.g. o("AB").
const o = t => `<span class="o">${t}</span>`;

// Numbers with a true minus sign: −3 instead of -3.
const showNum = v => typeof v === "number" ? (v < 0 ? "−" + Math.abs(v) : String(v)) : v;

// Table of values. rows: [["x", [-2, -1, 0, 1, 2]], ["y", [8, 2, 0, 2, 8]]]
const tov = (rows, caption) => `<div class="tbl-wrap"><table class="tov">${caption ? `<caption>${caption}</caption>` : ""}<tbody>${rows.map(([head, vals]) =>
  `<tr><th scope="row">${head}</th>${vals.map(v => `<td>${showNum(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

// Concept table with column headings. head: ["Line", "What it does"], rows: [["Median", "..."], ...]
const ctable = (head, rows, caption) => `<div class="tbl-wrap"><table class="ctable">${caption ? `<caption>${caption}</caption>` : ""}<thead><tr>${head.map(h => `<th scope="col">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r =>

<script>
// ---------- drawing helpers (SVG strings) ----------
const P = (x, y) => ({ x, y });
const f1 = n => Math.round(n * 10) / 10;
const sub = (a, b) => P(a.x - b.x, a.y - b.y);
const unit = v => { const l = Math.hypot(v.x, v.y) || 1; return P(v.x / l, v.y / l); };
const at = (a, b, t) => P(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
const pts = arr => arr.map(p => `${f1(p.x)},${f1(p.y)}`).join(" ");
const seg = (a, b, cls = "ln") => `<line class="${cls}" x1="${f1(a.x)}" y1="${f1(a.y)}" x2="${f1(b.x)}" y2="${f1(b.y)}"/>`;
const dot = (p, r = 4, cls = "pt") => `<circle class="${cls}" cx="${f1(p.x)}" cy="${f1(p.y)}" r="${r}"/>`;
const lbl = (p, t, dx = 0, dy = 0, cls = "lbl") => `<text x="${f1(p.x + dx)}" y="${f1(p.y + dy)}" class="${cls}" text-anchor="middle">${t}</text>`;
const txt = (x, y, t, cls = "cap", anchor = "middle") => `<text x="${f1(x)}" y="${f1(y)}" class="${cls}" text-anchor="${anchor}">${t}</text>`;
// arc marking the angle at V between rays VA and VB (the smaller angle)
function arcM(V, A, B, r = 22, cls = "am") {
  const a1 = Math.atan2(A.y - V.y, A.x - V.x);
  let d = Math.atan2(B.y - V.y, B.x - V.x) - a1;
  while (d > Math.PI) d -= 2 * Math.PI;
  while (d <= -Math.PI) d += 2 * Math.PI;
  const s = P(V.x + r * Math.cos(a1), V.y + r * Math.sin(a1)), e = P(V.x + r * Math.cos(a1 + d), V.y + r * Math.sin(a1 + d));
  return `<path class="${cls}" d="M${f1(s.x)} ${f1(s.y)} A${r} ${r} 0 0 ${d > 0 ? 1 : 0} ${f1(e.x)} ${f1(e.y)}"/>`;
}
// n tick marks across the middle of segment AB
function ticks(A, B, n = 1) {
  const m = at(A, B, 0.5), u = unit(sub(B, A)), nv = P(-u.y, u.x);
  let out = "";
  for (let i = 0; i < n; i++) {
    const off = (i - (n - 1) / 2) * 6, c = P(m.x + u.x * off, m.y + u.y * off);
    out += seg(P(c.x - nv.x * 7, c.y - nv.y * 7), P(c.x + nv.x * 7, c.y + nv.y * 7), "tk");
  }
  return out;
}
// right-angle box at V, along the rays toward A and B
function rightM(V, A, B, s = 12) {
  const u = unit(sub(A, V)), w = unit(sub(B, V));
  const p1 = P(V.x + u.x * s, V.y + u.y * s), p3 = P(V.x + w.x * s, V.y + w.y * s), p2 = P(p1.x + w.x * s, p1.y + w.y * s);
  return `<path class="right" d="M${f1(p1.x)} ${f1(p1.y)} L${f1(p2.x)} ${f1(p2.y)} L${f1(p3.x)} ${f1(p3.y)}"/>`;
}
// arrowhead at `to`, pointing away from `from`
function arrow(from, to) {
  const u = unit(sub(to, from)), nv = P(-u.y, u.x), b = P(to.x - u.x * 11, to.y - u.y * 11);
  return `<path class="ink" d="M${f1(to.x)} ${f1(to.y)} L${f1(b.x + nv.x * 5)} ${f1(b.y + nv.y * 5)} L${f1(b.x - nv.x * 5)} ${f1(b.y - nv.y * 5)} Z"/>`;
}
// circle arc around c from angle a0 to a1 (radians, clockwise on screen)
function arcAt(c, r, a0, a1, cls = "ln") {
  const s = P(c.x + r * Math.cos(a0), c.y + r * Math.sin(a0)), e = P(c.x + r * Math.cos(a1), c.y + r * Math.sin(a1));
  return `<path class="${cls}" d="M${f1(s.x)} ${f1(s.y)} A${f1(r)} ${f1(r)} 0 0 1 ${f1(e.x)} ${f1(e.y)}"/>`;
}

// coordinate plane with curves; returns the SVG body
function plot(c) {
  const m = 8, sx = (c.W - 2 * m) / (c.x1 - c.x0), sy = (c.H - 2 * m) / (c.y1 - c.y0);
  const X = x => m + (x - c.x0) * sx, Y = y => m + (c.y1 - y) * sy;
  let s = `<defs><clipPath id="${c.id}"><rect x="${m}" y="${m}" width="${c.W - 2 * m}" height="${c.H - 2 * m}"/></clipPath></defs><g>`;
  for (let x = Math.ceil(c.x0); x <= c.x1; x++) s += `<line class="gl" x1="${f1(X(x))}" y1="${m}" x2="${f1(X(x))}" y2="${c.H - m}"/>`;
  for (let y = Math.ceil(c.y0); y <= c.y1; y++) s += `<line class="gl" x1="${m}" y1="${f1(Y(y))}" x2="${c.W - m}" y2="${f1(Y(y))}"/>`;
  s += `</g><line class="ax" x1="${m}" y1="${f1(Y(0))}" x2="${c.W - m}" y2="${f1(Y(0))}"/><line class="ax" x1="${f1(X(0))}" y1="${m}" x2="${f1(X(0))}" y2="${c.H - m}"/>`;
  for (let x = Math.ceil(c.x0); x <= c.x1; x++) if (x && x % (c.nx || 2) === 0) s += txt(X(x), Y(0) + 14, String(x).replace("-", "−"), "num");
  for (let y = Math.ceil(c.y0); y <= c.y1; y++) if (y && y % (c.ny || 2) === 0) s += txt(X(0) - 5, Y(y) + 4, String(y).replace("-", "−"), "num", "end");
  s += `<g clip-path="url(#${c.id})">`;
  (c.vlines || []).forEach(v => { s += `<line class="axis-sym" x1="${f1(X(v))}" y1="${m}" x2="${f1(X(v))}" y2="${c.H - m}"/>`; });
  (c.curves || []).forEach(cv => {
    let d = "";
    for (let i = 0; i <= 240; i++) { const x = c.x0 + (c.x1 - c.x0) * i / 240; d += `${i ? "L" : "M"}${f1(X(x))} ${f1(Math.max(-2000, Math.min(2000, Y(cv.f(x)))))}`; }
    s += `<path class="${cv.cls}" d="${d}"/>`;
  });
  (c.dots || []).forEach(p => { s += dot(P(X(p.x), Y(p.y)), p.r || 5, p.cls || "pt hot"); if (p.t) s += txt(X(p.x) + (p.dx || 0), Y(p.y) + (p.dy || -10), p.t, p.tcls || "cap strong", p.anchor || "middle"); });
  return s + `</g>`;
}

// number and equation formatting for the parabola explorers
const fmt = n => (n < 0 ? "−" : "") + Math.abs(n);
const coef = a => a === 1 ? "" : a === -1 ? "−" : fmt(a);
const inner = h => h === 0 ? "x" : `(x ${h > 0 ? "−" : "+"} ${Math.abs(h)})`;
const eqStr = (a, h, k) => `y = ${coef(a)}${inner(h)}²${k ? ` ${k > 0 ? "+" : "−"} ${Math.abs(k)}` : ""}`;
const units = n => `${Math.abs(n)} unit${Math.abs(n) === 1 ? "" : "s"}`;

const PB = {
  a:   { title: "Change a and watch the graph of y = ax²", a: 2, h: 0, k: 0 },
  ak:  { title: "Change a and b in y = ax² + b", a: 1, h: 0, k: 3 },
  ah:  { title: "Change a and b in y = a(x − b)²", a: 1, h: 2, k: 0 },
  ahk: { title: "Change a, h, and k in y = a(x − h)² + k", a: 2, h: 3, k: 1 }
};
function pbHTML(id, mode) {
  const c = PB[mode], hasH = mode.includes("h"), hasK = mode.includes("k");

  const sl = (key, name, min, max, step, val, help) => `<label for="${id}-${key}">${name}${help ? ` <span class="muted">(${help})</span>` : ""}: <output data-o${key}></output></label><input type="range" id="${id}-${key}" min="${min}" max="${max}" step="${step}" value="${val}" data-${key}>`;
  return `<div class="explore" data-explore="pb" data-mode="${mode}" id="${id}">
    <div class="explore-head"><span class="eyebrow">Try it</span><b>${c.title}</b></div>
    <svg viewBox="0 0 320 320" class="fig" role="img" aria-label="Graph of a parabola that updates as the sliders change"><g data-g></g></svg>
    <div class="sliders ${hasH && hasK ? "s3" : ""}">
      ${sl("a", "a", -3, 3, 0.5, c.a, "shape and opening")}
      ${hasH ? sl("h", hn, -4, 4, 1, c.h, "left or right") : ""}
      ${hasK ? sl("k", kn, -4, 4, 1, c.k, "up or down") : ""}
    </div>
    <p class="result" data-res aria-live="polite"></p>
  </div>`;
}

// ---------- figures ----------
const FIG = {
  "terms": () => {
    const y1 = 78, y2 = 222;
    return `<svg viewBox="0 0 600 290" class="fig wide" role="img" aria-label="Undefined terms: point A, line BC, plane M. Defined terms: segment DE, ray FG, angle HIJ">

      ${dot(P(100, y1), 5)}${lbl(P(100, y1), "A", 0, -14)}${txt(100, 140, "Point A")}
      ${seg(P(224, y1), P(376, y1))}${arrow(P(300, y1), P(380, y1))}${arrow(P(300, y1), P(220, y1))}${dot(P(262, y1))}${dot(P(338, y1))}${lbl(P(262, y1), "B", 0, -14)}${lbl(P(338, y1), "C", 0, -14)}${txt(300, 140, "Line BC")}
      <polygon class="plane" points="425,110 575,110 548,48 398,48"/>${lbl(P(540, 100), "M")}${txt(487, 140, "Plane M")}
      ${seg(P(35, y2), P(165, y2))}${dot(P(35, y2))}${dot(P(165, y2))}${lbl(P(35, y2), "D", 0, -14)}${lbl(P(165, y2), "E", 0, -14)}${txt(100, 278, "Segment DE")}
      ${seg(P(235, y2), P(376, y2))}${arrow(P(300, y2), P(380, y2))}${dot(P(235, y2))}${dot(P(310, y2))}${lbl(P(235, y2), "F", 0, -14)}${lbl(P(310, y2), "G", 0, -14)}${txt(305, 278, "Ray FG")}
      ${seg(P(430, 248), P(575, 248))}${seg(P(430, 248), P(525, 178))}${arcM(P(430, 248), P(575, 248), P(525, 178), 26)}${dot(P(430, 248))}${dot(P(560, 248))}${dot(P(510, 189))}${lbl(P(430, 248), "I", -12, 6)}${lbl(P(560, 248), "J", 0, -10)}${lbl(P(510, 189), "H", -8, -10)}${txt(500, 278, "∠HIJ")}
    </svg>`;
  },
  "vertical": () => {
    const O = P(170, 105), a = P(40, 40), b = P(300, 170), c = P(40, 170), d = P(300, 40);

  "congruence": () => {

  "hl": () => {

  },
  "iso-explorer": id => `
    <div class="explore" data-explore="iso" id="${id}">

  "perp-mid": () => {

  "secondary": () => {

function drawExplore(el) {
  if (el.dataset.explore === "mid") {
    const b1 = +$("[data-b1]", el).value, b2 = +$("[data-b2]", el).value, s = 8, c = 180, M = (b1 + b2) / 2;
    $("[data-poly]", el).setAttribute("points", `${c - b1 * s / 2},40 ${c + b1 * s / 2},40 ${c + b2 * s / 2},170 ${c - b2 * s / 2},170`);
    const m = $("[data-mid]", el);
    m.setAttribute("x1", c - M * s / 2); m.setAttribute("x2", c + M * s / 2);
    $("[data-t1]", el).textContent = `b₁ = ${b1} cm`; $("[data-t2]", el).textContent = `b₂ = ${b2} cm`;
    $("[data-o1]", el).textContent = b1; $("[data-o2]", el).textContent = b2;
    $("[data-res]", el).innerHTML = `M = (${b1} + ${b2}) ÷ 2 = <b>${M} cm</b>`;
  } else if (el.dataset.explore === "kite") {
    const d1 = +$("[data-d1in]", el).value, d2 = +$("[data-d2in]", el).value, s = 6, c = 150, y0 = 15;
    const yE = y0 + d1 * s * 0.3, yC = y0 + d1 * s, xl = c - d2 * s / 2, xr = c + d2 * s / 2;
    $("[data-poly]", el).setAttribute("points", `${c},${y0} ${xr},${yE} ${c},${yC} ${xl},${yE}`);
    const box = $("[data-box]", el);
    box.setAttribute("x", xl); box.setAttribute("y", y0); box.setAttribute("width", xr - xl); box.setAttribute("height", yC - y0);
    const l1 = $("[data-d1]", el), l2 = $("[data-d2]", el);
    [["x1", c], ["y1", y0], ["x2", c], ["y2", yC]].forEach(([k, v]) => l1.setAttribute(k, v));
    [["x1", xl], ["y1", yE], ["x2", xr], ["y2", yE]].forEach(([k, v]) => l2.setAttribute(k, v));
    $("[data-o1]", el).textContent = d1; $("[data-o2]", el).textContent = d2;
    $("[data-res]", el).innerHTML = `Rectangle: ${d1} × ${d2} = ${d1 * d2} cm². Kite: ½ × ${d1} × ${d2} = <b>${d1 * d2 / 2} cm²</b>`;
  } else if (el.dataset.explore === "iso") {
    const b = +$("[data-b]", el).value, L = 170, yb = 212, rad = b * Math.PI / 180, v = 180 - 2 * b;
    const A = P(170, yb - L * Math.sin(rad)), B = P(170 - L * Math.cos(rad), yb), C = P(170 + L * Math.cos(rad), yb);
    $("[data-g]", el).innerHTML = `<polygon class="tri" points="${pts([A, B, C])}"/>${ticks(A, B, 1)}${ticks(A, C, 1)}
      ${arcM(B, C, A, 28, "am hot")}${arcM(C, B, A, 28, "am hot")}${arcM(A, B, C, 20)}
      ${lbl(A, "A", 0, -10)}${lbl(B, "B", 0, 26)}${lbl(C, "C", 0, 26)}`;
    $("[data-o]", el).textContent = b;
    $("[data-res]", el).innerHTML = `AB = AC, so m∠C = m∠B = ${b}°.<br>Vertex angle: m∠A = 180° − 2(${b}°) = <b>${v}°</b>`;
  } else if (el.dataset.explore === "fence") {
    const x = +$("[data-x]", el).value, w = 10 - x, s = 20, A = x * w;
    const gx = L => 300 + L * 24, gy = a => 210 - a * 7.2;
    let g = `<rect class="tile" x="20" y="${f1(30 + (9 - w) * s / 2)}" width="${x * s}" height="${w * s}"/>
      ${txt(20 + x * s / 2, 30 + (9 - w) * s / 2 + w * s + 18, `${x} m`)}${txt(20 + x * s + 8, 30 + (9 - w) * s / 2 + w * s / 2 + 5, `${w} m`, "cap", "start")}
      ${txt(20 + x * s / 2, 30 + (9 - w) * s / 2 + w * s / 2 + 6, `${A} m²`, "lbl sm")}`;
    g += `<line class="ax" x1="${gx(0)}" y1="${gy(0)}" x2="${gx(10)}" y2="${gy(0)}"/><line class="ax" x1="${gx(0)}" y1="${gy(0)}" x2="${gx(0)}" y2="${gy(26)}"/>`;
    for (let a = 5; a <= 25; a += 5) g += `<line class="gl" x1="${gx(0)}" y1="${gy(a)}" x2="${gx(10)}" y2="${gy(a)}"/>${txt(gx(0) - 5, gy(a) + 4, a, "num", "end")}`;
    for (let L = 1; L <= 9; L++) g += txt(gx(L), gy(0) + 14, L, "num");
    let d = ""; for (let i = 0; i <= 100; i++) { const L = i / 10; d += `${i ? "L" : "M"}${f1(gx(L))} ${f1(gy(L * (10 - L)))}`; }
    g += `<path class="parent" d="${d}"/>`;
    for (let L = 1; L <= 9; L++) g += dot(P(gx(L), gy(L * (10 - L))), L === x ? 6 : 3.5, L === x ? "pt hot" : "pt");
    g += txt(gx(5), 246, "length x (m)", "num") + txt(gx(0) + 4, gy(26) + 2, "area (m²)", "num", "start");
    $("[data-g]", el).innerHTML = g;
    $("[data-o]", el).textContent = x;
    $("[data-res]", el).innerHTML = `Width = 10 − ${x} = ${w} m. Area: A = x(10 − x) = ${x} × ${w} = <b>${A} m²</b>${x === 5 ? ". This is the largest plot." : ""}`;
  } else if (el.dataset.explore === "pb") {
    const mode = el.dataset.mode, a = +$("[data-a]", el).value;
    const h = mode.includes("h") ? +$("[data-h]", el).value : 0, k = mode.includes("k") ? +$("[data-k]", el).value : 0;
    $("[data-oa]", el).textContent = fmt(a);
    if ($("[data-oh]", el)) $("[data-oh]", el).textContent = fmt(h);
    if ($("[data-ok]", el)) $("[data-ok]", el).textContent = fmt(k);
    const parentA = mode === "a" ? 1 : a;
    const curves = [{ f: x => parentA * x * x, cls: "parent" }, { f: x => a * (x - h) ** 2 + k, cls: "curve" }];
    $("[data-g]", el).innerHTML = plot({ id: `${el.id}-clip`, W: 320, H: 320, x0: -6, x1: 6, y0: -8, y1: 8, vlines: a ? [h] : [], curves, dots: a ? [{ x: h, y: k }] : [] });
    const res = $("[data-res]", el);
    if (a === 0) { res.innerHTML = `a cannot be 0. Then y = ${fmt(k)} is a straight line, not a parabola.`; return; }
    const dir = a > 0 ? "upward" : "downward";
    const base = eqStr(a, 0, 0);
    let out = `<b>${eqStr(a, h, k)}</b><br>Vertex (${fmt(h)}, ${fmt(k)}) · axis of symmetry x = ${fmt(h)} · opens ${dir}`;
    if (mode === "a") out += `<br>${Math.abs(a) > 1 ? "Narrower than" : Math.abs(a) < 1 ? "Wider than" : a === 1 ? "This is" : "Same width as"} y = x²${a === -1 ? ", flipped" : ""}. The dashed curve is y = x².`;
    if (mode === "ak") out += `<br>${k ? `Moved ${units(k)} ${k > 0 ? "up" : "down"} from` : "No shift from"} ${base} (dashed). In y = ax² + b, the vertex is (0, b).`;
    if (mode === "ah") out += `<br>${h ? `Moved ${units(h)} to the ${h > 0 ? "right" : "left"} of` : "No shift from"} ${base} (dashed). In y = a(x − b)², the vertex is (b, 0).`;
    if (mode === "ahk") out += `<br>The vertex is the ${a > 0 ? "lowest" : "highest"} point, so the ${a > 0 ? "minimum" : "maximum"} value is ${fmt(k)}.`;
    res.innerHTML = out;
  }
}

function trussFig(iso) {
  const A = P(30, 185), C = P(330, 185), B = P(180, 40), D = P(180, 185);
  return `<svg viewBox="0 0 360 232" class="fig" style="max-width:440px" role="img" aria-label="${iso ? "Isosceles triangle ABC with AB congruent to CB and median BD to the base" : "Roof truss ABC with king post BD; D is the midpoint of AC and BD is perpendicular to AC"}">
    <polygon class="tri" points="${pts([A, B, C])}"/>${seg(B, D, "acc")}${ticks(A, D, 2)}${ticks(D, C, 2)}${iso ? ticks(A, B, 1) + ticks(B, C, 1) : rightM(D, C, B)}
    ${dot(D)}${lbl(A, "A", -12, 16)}${lbl(C, "C", 12, 16)}${lbl(B, "B", 0, -12)}${lbl(D, "D", 0, 22)}
    ${txt(180, 226, iso ? "AB ≅ CB and AD ≅ CD. Prove: BD ⊥ AC" : "D is the midpoint of AC and BD ⊥ AC")}
  </svg>`;
}


</script>
<script>
// Interactive activities ("Try it" boxes).
// Each entry in IX has:
//   html(id, lesson, week)  -> the starting markup
//   draw(el, event)         -> redraws after any slider, select, or text change
//   act(el, name, button)   -> runs when a button with data-act="name" is pressed
// State for one box lives in el.S, so it resets when the page is reopened.

const IX = {};

// ---------- number and equation formatting ----------
const FR = [[0.5, "½"], [0.25, "¼"], [1 / 3, "⅓"], [0.75, "¾"], [2 / 3, "⅔"], [1.5, "1.5"], [0.125, "⅛"]];
function nf(n) { // nice number: −3, 1.5, ½
  if (Object.is(n, -0)) n = 0;
  const s = n < 0 ? "−" : "", v = Math.abs(n);
  const f = FR.find(([x]) => Math.abs(x - v) < 1e-9);
  if (f && v < 1) return s + f[1];
  return s + String(Math.round(v * 100) / 100);
}
const coefA = a => a === 1 ? "" : a === -1 ? "−" : nf(a);
const signed = (v, sp = true) => (v < 0 ? (sp ? " − " : "−") : (sp ? " + " : "+")) + nf(Math.abs(v)); // " + 3"
function vform(a, h, k, name = "y") { // y = a(x − h)² + k
  const inner = h === 0 ? "x" : `(x${signed(-h)})`;
  return `${name} = ${coefA(a)}${inner}²${k ? signed(k) : ""}`;
}
function sform(a, b, c, name = "y") { // y = ax² + bx + c
  let s = `${coefA(a)}x²`;
  if (b) s += (b < 0 ? " − " : " + ") + (Math.abs(b) === 1 ? "" : nf(Math.abs(b))) + "x";
  if (c) s += signed(c);
  return `${name} = ${s}`;
}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const near = (a, b, tol = 0.01) => Math.abs(a - b) < tol;
const val = (el, sel) => num($(sel, el).value);

// ---------- box wrapper ----------
const ixBox = (id, name, title, inner, wide) => `<div class="explore ix${wide ? " ix-wide" : ""}" data-ix="${name}" id="${id}">
  <div class="explore-head"><span class="eyebrow">Try it</span><b>${title}</b></div>${inner}</div>`;
const say = (el, html, ok) => { const r = $("[data-say]", el); if (!r) return; r.className = "result" + (ok === true ? " good" : ok === false ? " bad" : ""); r.innerHTML = html; };
const sayBox = () => `<p class="result" data-say aria-live="polite"></p>`;
const slider = (id, key, label, min, max, step, v, help) => `<div class="sl"><label for="${id}-${key}">${label}${help ? ` <span class="muted">(${help})</span>` : ""}: <output data-o="${key}">${nf(v)}</output></label>
  <input type="range" id="${id}-${key}" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
const sv = (el, key) => { const i = $(`[data-k="${key}"]`, el); const v = +i.value; const o = $(`[data-o="${key}"]`, el); if (o) o.textContent = nf(v); return v; };
const numIn = (id, key, label, w = "6em") => `<span class="nin"><label for="${id}-${key}">${label}</label><input id="${id}-${key}" data-in="${key}" inputmode="decimal" autocomplete="off" style="width:${w}"></span>`;
const inV = (el, key) => num($(`[data-in="${key}"]`, el).value);
const mark = (el, key, ok) => { const i = $(`[data-in="${key}"]`, el); if (i) { i.classList.toggle("ok", ok); i.classList.toggle("no", !ok); i.setAttribute("aria-invalid", String(!ok)); } };

// ---------- coordinate plane ----------
// G({W, H, x0, x1, y0, y1, id}) returns helpers that build one SVG.
function G(c) {
  const m = 10, sx = (c.W - 2 * m) / (c.x1 - c.x0), sy = (c.H - 2 * m) / (c.y1 - c.y0);
  const X = x => m + (x - c.x0) * sx, Y = y => m + (c.y1 - y) * sy;
  const stepOf = (span) => span > 30 ? 5 : span > 16 ? 2 : 1;
  const gx = c.gx || stepOf(c.x1 - c.x0), gy = c.gy || stepOf(c.y1 - c.y0);
  const nx = c.nx || gx * 2, ny = c.ny || gy * 2;
  const g = {
    X, Y,
    grid() {
      let s = "";
      for (let x = Math.ceil(c.x0 / gx) * gx; x <= c.x1; x += gx) s += `<line class="gl" x1="${f1(X(x))}" y1="${m}" x2="${f1(X(x))}" y2="${c.H - m}"/>`;
      for (let y = Math.ceil(c.y0 / gy) * gy; y <= c.y1; y += gy) s += `<line class="gl" x1="${m}" y1="${f1(Y(y))}" x2="${c.W - m}" y2="${f1(Y(y))}"/>`;
      const ax = Math.min(Math.max(0, c.y0), c.y1), ay = Math.min(Math.max(0, c.x0), c.x1);
      s += `<line class="ax" x1="${m}" y1="${f1(Y(ax))}" x2="${c.W - m}" y2="${f1(Y(ax))}"/><line class="ax" x1="${f1(X(ay))}" y1="${m}" x2="${f1(X(ay))}" y2="${c.H - m}"/>`;
      for (let x = Math.ceil(c.x0 / nx) * nx; x <= c.x1; x += nx) if (x) s += txt(X(x), Y(ax) + 14, nf(x), "num");
      for (let y = Math.ceil(c.y0 / ny) * ny; y <= c.y1; y += ny) if (y) s += txt(X(ay) - 5, Y(y) + 4, nf(y), "num", "end");
      if (c.xl) s += txt(c.W - m - 2, Y(ax) - 6, c.xl, "num", "end");
      if (c.yl) s += txt(X(ay) + 6, m + 10, c.yl, "num", "start");
      return s;
    },
    clipOpen: () => `<defs><clipPath id="${c.id}-cp"><rect x="${m}" y="${m}" width="${c.W - 2 * m}" height="${c.H - 2 * m}"/></clipPath></defs><g clip-path="url(#${c.id}-cp)">`,
    curve(f, cls = "curve", a = c.x0, b = c.x1, n = 200) {
      let d = "";
      for (let i = 0; i <= n; i++) { const x = a + (b - a) * i / n; d += `${i ? "L" : "M"}${f1(X(x))} ${f1(Math.max(-3000, Math.min(3000, Y(f(x)))))}`; }
      return `<path class="${cls}" d="${d}"/>`;
    },
    poly(ptsArr, cls = "segs") { return `<polyline class="${cls}" points="${ptsArr.map(([x, y]) => `${f1(X(x))},${f1(Y(y))}`).join(" ")}"/>`; },
    pt(x, y, cls = "pt hot", r = 5) { return `<circle class="${cls}" cx="${f1(X(x))}" cy="${f1(Y(y))}" r="${r}"/>`; },
    label(x, y, t, dx = 0, dy = -10, cls = "cap strong", anchor = "middle") { return txt(X(x) + dx, Y(y) + dy, t, cls, anchor); },
    vline(x, cls = "axis-sym") { return `<line class="${cls}" x1="${f1(X(x))}" y1="${m}" x2="${f1(X(x))}" y2="${c.H - m}"/>`; },
    hline(y, cls = "axis-sym") { return `<line class="${cls}" x1="${m}" y1="${f1(Y(y))}" x2="${c.W - m}" y2="${f1(Y(y))}"/>`; },
    svg(inner, label, style = "") { return `<svg viewBox="0 0 ${c.W} ${c.H}" class="fig" ${style ? `style="${style}"` : ""} role="img" aria-label="${label}">${inner}</svg>`; }
  };
  return g;
}

// ---------- sorting tasks: more than one per week ----------
// A lesson figure "sorter" uses week.sorter; "sorter:name" uses week.sorters[name].
function sorterData(wk, key) {
  if (!key) return { cfg: sorterCfg(wk), items: wk.sorter, key: "" };
  const s = wk.sorters[key];
  return { cfg: Object.assign({ noun: "", hint: "Not quite. Read it again and try the other choice." }, s.cfg), items: s.items, key };
}

// ---------- events ----------
function ixDraw(el, e) { const d = IX[el.dataset.ix]; if (d && d.draw) d.draw(el, e); }
document.addEventListener("input", e => { const el = e.target.closest("[data-ix]"); if (el && !e.target.matches("[data-in], textarea")) ixDraw(el, e); });
document.addEventListener("change", e => { const el = e.target.closest("[data-ix]"); if (el && e.target.matches("select, input[type=radio], input[type=checkbox]")) ixDraw(el, e); });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const el = b.closest("[data-ix]"); if (!el) return;
  const d = IX[el.dataset.ix]; if (d && d.act) d.act(el, b.dataset.act, b);
});
// Enter in a text box presses the button named in data-enter (or the nearest Check button).
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || !e.target.matches("[data-ix] input[data-in]")) return;

});
function initIX(root = document) { $$("[data-ix]", root).forEach(el => { const d = IX[el.dataset.ix]; if (d && d.init) d.init(el); ixDraw(el); }); }

</script>
<script>
// Interactives for geometry (Weeks 1 to 5).

const deg = r => r * 180 / Math.PI, rad = d => d * Math.PI / 180;
const r1 = n => Math.round(n * 10) / 10;
const dist = (p, q) => Math.hypot(p.x - q.x, p.y - q.y);

// ===== 1.3 Kite explorer =====
IX.kite = {
  html: id => ixBox(id, "kite", "Kite explorer: change the kite and watch its properties", `<div data-g></div>
    <div class="sliders s3">${slider(id, "ae", "AE (top part of AC)", 1, 6, 0.5, 2)}${slider(id, "ec", "EC (bottom part of AC)", 1, 9, 0.5, 5)}${slider(id, "be", "BE (half of BD)", 1, 6, 0.5, 3)}</div>${sayBox()}`),
  draw(el) {
    const ae = sv(el, "ae"), ec = sv(el, "ec"), be = sv(el, "be");
    const s = Math.min(210 / (ae + ec), 250 / (2 * be), 30), cx = 170, top = 24;
    const A = P(cx, top), E = P(cx, top + ae * s), C = P(cx, top + (ae + ec) * s), B = P(cx + be * s, E.y), D = P(cx - be * s, E.y);
    const g = `<polygon class="tri" points="${pts([A, B, C, D])}"/>${seg(A, C, "ln dash")}${seg(B, D, "ln dash")}${rightM(E, B, A, 10)}
      ${ticks(A, B, 1)}${ticks(A, D, 1)}${ticks(C, B, 2)}${ticks(C, D, 2)}${arcM(B, A, C, 20, "am hot")}${arcM(D, A, C, 20, "am hot")}
      ${lbl(A, "A", 0, -8)}${lbl(B, "B", 16, 6)}${lbl(C, "C", 0, 20)}${lbl(D, "D", -16, 6)}${lbl(E, "E", 12, 18, "lbl sm")}`;
    $("[data-g]", el).innerHTML = svgWrap(340, top + (ae + ec) * s + 30, g, "Kite ABCD with diagonals meeting at E", 380);
    const ab = Math.hypot(ae, be), cb = Math.hypot(ec, be), angB = deg(Math.atan(ae / be) + Math.atan(ec / be));
    say(el, ae === ec ? `AE = EC, so all four sides are ${r1(ab)}: this is a rhombus, not a kite in our lessons. Make AE and EC different.`
      : `AB = AD = ${r1(ab)} and CB = CD = ${r1(cb)}: two pairs of adjacent congruent sides.<br>The diagonals meet at a right angle at E. BE = ED = ${nf(be)}, so AC bisects BD. But AE = ${nf(ae)} and EC = ${nf(ec)}, so BD does not bisect AC.<br>m∠B = m∠D ≈ ${r1(angB)}°: the angles where the unequal sides meet are congruent.`);
  }
};

// ===== 2.1 Trapezoid frame =====
IX.trapframe = {
  html: id => ixBox(id, "trapframe", "Trapezoid frame: change the bases and the base angle", `<div data-g></div>
    <div class="sliders s3">${slider(id, "b1", "Top base (m)", 4, 20, 1, 16)}${slider(id, "b2", "Bottom base (m)", 6, 40, 1, 28)}${slider(id, "t", "Base angle (°)", 40, 80, 1, 70)}</div>${sayBox()}`),
  draw(el) {
    const b1 = sv(el, "b1"), b2 = sv(el, "b2"), t = sv(el, "t");
    if (b2 <= b1) { $("[data-g]", el).innerHTML = ""; return say(el, "Make the bottom base longer than the top base.", false); }
    const hgt = (b2 - b1) / 2 * Math.tan(rad(t)), s = Math.min(300 / b2, 150 / hgt), x0 = 180 - b2 * s / 2, yb = 190;
    const D = P(x0, yb), C = P(x0 + b2 * s, yb), A = P(180 - b1 * s / 2, yb - hgt * s), B = P(180 + b1 * s / 2, yb - hgt * s);
    const M1 = at(A, D, 0.5), M2 = at(B, C, 0.5), mid = (b1 + b2) / 2;
    const g = `<polygon class="tri" points="${pts([A, B, C, D])}"/>${seg(M1, M2, "mid")}${ticks(A, D, 1)}${ticks(B, C, 1)}
      ${arcM(D, C, A, 22, "am hot")}${arcM(C, D, B, 22, "am hot")}${arcM(A, B, D, 18)}${arcM(B, A, C, 18)}
      ${txt(180, A.y - 8, `${b1} m`)}${txt(180, yb + 18, `${b2} m`)}${txt(180, M1.y - 6, `${nf(mid)} m`, "cap strong")}
      ${txt(D.x + 34, yb - 8, `${t}°`, "num")}${txt(C.x - 34, yb - 8, `${t}°`, "num")}${txt(A.x + 6, A.y + 26, `${180 - t}°`, "num", "start")}${txt(B.x - 6, B.y + 26, `${180 - t}°`, "num", "end")}`;
    $("[data-g]", el).innerHTML = svgWrap(360, 212, g, "Isosceles trapezoid frame with its midsegment", 440);
    say(el, `Midsegment = (${b1} + ${b2}) ÷ 2 = <b>${nf(mid)} m</b> (the red dashed support).<br>Angles along each leg: ${t}° + ${180 - t}° = 180°. The base angles are congruent (${t}° and ${t}°) because the legs are congruent.`);
  }
};

// ===== 3.2 Vertical angles =====
IX.vertical = {
  html: id => ixBox(id, "vertical", "Turn one line and watch the angles", `<div data-g></div>
    <div class="sliders">${slider(id, "t", "m∠1 (°)", 20, 160, 1, 65)}</div>${sayBox()}`),
  draw(el) {
    const t = sv(el, "t"), O = P(170, 115), L = 140, dir = a => P(O.x + L * Math.cos(rad(a)), O.y - L * Math.sin(rad(a)));
    const R = dir(0), Lf = dir(180), U = dir(t), D = dir(t + 180), lab = (a, n) => { const p = P(O.x + 48 * Math.cos(rad(a)), O.y - 48 * Math.sin(rad(a)) + 6); return lbl(p, n, 0, 0, "lbl sm"); };
    const g = `${seg(Lf, R)}${seg(D, U)}${arcM(O, R, U, 30, "am hot")}${arcM(O, Lf, D, 30, "am hot")}${arcM(O, U, Lf, 22)}${arcM(O, D, R, 22)}${dot(O)}
      ${lab(t / 2, "1")}${lab(180 + t / 2, "2")}${lab(90 + t / 2, "3")}${lab(270 + t / 2, "4")}`;
    $("[data-g]", el).innerHTML = svgWrap(340, 230, g, "Two intersecting lines forming four angles", 420);
    say(el, `m∠1 = <b>${t}°</b> and its vertical angle m∠2 = <b>${t}°</b>.<br>m∠3 = m∠4 = 180° − ${t}° = <b>${180 - t}°</b>. Vertical angles stay congruent however you turn the line.`);
  }
};

// ===== 3.3 Congruence detective =====
const CONG_CASES = [
  ["SSS", ["AB", "BC", "CA"], "All three pairs of sides are congruent."],
  ["SAS", ["AB", "CA", "A"], "∠A is between AB and AC: the included angle."],
  ["SAS", ["AB", "BC", "B"], "∠B is between AB and BC: the included angle."],
  ["ASA", ["A", "B", "AB"], "AB is between ∠A and ∠B: the included side."],
  ["ASA", ["B", "C", "BC"], "BC is between ∠B and ∠C: the included side."],
  ["AAS", ["A", "B", "BC"], "BC is not between ∠A and ∠B: a non-included side."],
  ["AAS", ["B", "C", "AB"], "AB is not between ∠B and ∠C: a non-included side."],
  ["Not enough", ["AB", "BC", "A"], "∠A is not between AB and BC. SSA does not prove congruence."],
  ["Not enough", ["A", "B", "C"], "Three angles (AAA) give the same shape but maybe a different size."]];
const TRI_SHAPES = [[P(20, 160), P(140, 160), P(60, 50)], [P(15, 150), P(150, 150), P(110, 45)], [P(25, 155), P(135, 135), P(40, 40)]];
function markedTri(T, names, marks, ox) {
  const Q = T.map(p => P(p.x + ox, p.y)), idx = { A: 0, B: 1, C: 2 };
  let s = `<polygon class="tri" points="${pts(Q)}"/>`;
  const sideN = { AB: [0, 1, 1], BC: [1, 2, 2], CA: [2, 0, 3] };
  marks.forEach(m => {
    if (m.length === 2) { const [i, j, n] = sideN[m]; s += seg(Q[i], Q[j], "acc") + ticks(Q[i], Q[j], n); }
    else { const i = idx[m], o = [0, 1, 2].filter(x => x !== i); for (let r = 0; r <= i; r++) s += arcM(Q[i], Q[o[0]], Q[o[1]], 18 + r * 6, "am hot"); }
  });
  const c = P((Q[0].x + Q[1].x + Q[2].x) / 3, (Q[0].y + Q[1].y + Q[2].y) / 3);
  Q.forEach((p, i) => { const u = unit(sub(p, c)); s += lbl(P(p.x + u.x * 16, p.y + u.y * 16 + 6), names[i], 0, 0, "lbl sm"); });
  return s;
}
IX.detect = {
  html: id => ixBox(id, "detect", "Congruence detective: which postulate fits the marks?", `<div data-g></div>
    <div class="row" role="group" aria-label="Your answer">${["SSS", "SAS", "ASA", "AAS", "Not enough"].map(o => `<button type="button" class="btn sm" data-act="ans" data-v="${o}">${o === "Not enough" ? "Not enough information" : o}</button>`).join("")}</div>
    ${sayBox()}<div class="row"><button type="button" class="btn sm primary" data-act="next">Next case</button><span class="muted small" data-score></span></div>`),
  init(el) { el.S = { right: 0, total: 0 }; this.newCase(el); },
  newCase(el) { let c; do { c = pick(CONG_CASES); } while (el.S.c === c); el.S.c = c; el.S.T = pick(TRI_SHAPES); el.S.answered = false; },
  draw(el) {
    const S = el.S, [, marks] = S.c;
    $("[data-g]", el).innerHTML = svgWrap(340, 190, markedTri(S.T, ["A", "B", "C"], marks, 0) + markedTri(S.T, ["D", "E", "F"], marks, 175), "Two triangles with matching marked parts", 460);
    if (!S.answered) say(el, "The red marks show the congruent corresponding parts. Which postulate or theorem proves △ABC ≅ △DEF?");
    $("[data-score]", el).textContent = `Score: ${S.right} of ${S.total}`;
  },
  act(el, n, b) {
    const S = el.S;
    if (n === "next") { this.newCase(el); this.draw(el); return; }
    if (n === "ans" && !S.answered) {
      S.answered = true; S.total++; const ok = b.dataset.v === S.c[0]; if (ok) S.right++;
      say(el, `${ok ? "Correct." : `Not quite. The answer is ${S.c[0] === "Not enough" ? "not enough information" : S.c[0]}.`} ${S.c[2]} Press <b>Next case</b>.`, ok);
      $("[data-score]", el).textContent = `Score: ${S.right} of ${S.total}`;
    }
  }
};

// ===== 3.4 CPCTC highlighter =====
IX.cpctc = {
  html: id => ixBox(id, "cpctc", "Find the corresponding parts", `
    <div class="row"><label for="${id}-st">Congruence statement</label><select id="${id}-st" data-st><option value="DEF">△ABC ≅ △DEF</option><option value="FDE">△ABC ≅ △FDE</option></select></div>
    <div data-g></div>
    <div class="row" role="group" aria-label="Part of triangle ABC">${["AB", "BC", "CA", "∠A", "∠B", "∠C"].map(p => `<button type="button" class="btn sm" data-act="part" data-v="${p}">${p.length === 2 ? o(p) : p}</button>`).join("")}</div>${sayBox()}`),
  init(el) { el.S = { part: "AB" }; },
  draw(el) {

    const other = part[0] === "∠" ? `∠${corr(part[1])}` : o(corr(part[0]) + corr(part[1]));
    say(el, `△ABC ≅ △${map}: A ↔ ${corr("A")}, B ↔ ${corr("B")}, C ↔ ${corr("C")}.<br>By CPCTC, <b>${part[0] === "∠" ? part : o(part)} ≅ ${other}</b>. Change the statement: the order of the letters decides which parts match.`);
  },
  act(el, n, b) { if (n === "part") { el.S.part = b.dataset.v; this.draw(el); } }
};

// ===== 4.1 HL explorer =====
IX.hl = {
  html: id => ixBox(id, "hl", "HL explorer: are the two right triangles congruent?", `<div data-g></div>
    <div class="sliders hl4">${slider(id, "h1", "Triangle 1 hypotenuse", 5, 15, 0.5, 13)}${slider(id, "l1", "Triangle 1 leg", 3, 14, 0.5, 5)}${slider(id, "h2", "Triangle 2 hypotenuse", 5, 15, 0.5, 13)}${slider(id, "l2", "Triangle 2 leg", 3, 14, 0.5, 5)}</div>${sayBox()}`),
  draw(el) {
    const h1 = sv(el, "h1"), l1 = sv(el, "l1"), h2 = sv(el, "h2"), l2 = sv(el, "l2"), s = 9;
    const tri = (h, l, ox, nm) => {
      if (l >= h) return txt(ox + 70, 120, "leg ≥ hypotenuse: impossible", "cap");
      const m = Math.sqrt(h * h - l * l), Q = P(ox, 205), Pp = P(ox, 205 - l * s), R = P(ox + m * s, 205);
      return `<polygon class="tri" points="${pts([Pp, Q, R])}"/>${seg(Pp, R, "acc")}${rightM(Q, Pp, R, 10)}${lbl(Pp, nm[0], -12, 0, "lbl sm")}${lbl(Q, nm[1], -12, 14, "lbl sm")}${lbl(R, nm[2], 10, 14, "lbl sm")}
        ${txt(ox - 6, 205 - l * s / 2, nf(l), "num", "end")}${txt(ox + m * s / 2, 222, nf(r1(m)), "num")}${txt(ox + m * s / 2 + 10, 205 - l * s / 2 - 6, nf(h), "cap strong", "start")}`;
    };
    $("[data-g]", el).innerHTML = svgWrap(600, 230, tri(h1, l1, 30, "PQR") + tri(h2, l2, 320, "XYZ"), "Two right triangles", 620);
