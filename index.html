        "Step 2: Keep the same width. Put the point on C and draw arcs that cross the first ones. Label the crossings P and Q.",
        `Step 3: Draw line PQ. It is the perpendicular bisector of AC: it meets AC at a right angle at its midpoint M. AM = MC = ${nf(r1(dist(A, M) / U))} units.`,
        "Why it works: PA ≅ PC and QA ≅ QC (same compass width). A point the same distance from A and C lies on the perpendicular bisector of AC, so line PQ is that bisector. (△APQ ≅ △CPQ by SSS.)"]
        : ["Start with △ABC. We will construct the median from vertex B to side AC.",
        "Step 1: To find the midpoint of AC, open the compass to more than half of AC. Put the point on A and draw arcs above and below AC.",
        "Step 2: Keep the same width. Put the point on C and draw arcs that cross the first ones at P and Q.",
        `Step 3: Lay the straightedge on P and Q. Where it crosses AC is the midpoint M. AM = MC = ${nf(r1(dist(A, M) / U))} units.`,
        "Step 4: Draw segment BM. It is the median from B: it joins a vertex to the midpoint of the opposite side.",
        "Why it works: P and Q are each the same distance from A and C, so line PQ is the perpendicular bisector of AC and passes through its midpoint M. Do this from two vertices: the medians meet at the centroid."];
      cap = caps[st];
    } else if (t === "alt") {
      if (st >= 1) g += arcAt(B, rB, angTo(B, Ep) - 0.15, angTo(B, Dp) + 0.15, "ln dash") + dot(Dp) + dot(Ep) + lbl(Dp, "D", -2, -10) + lbl(Ep, "E", 2, -10);
      if (st >= 2) g += arcNear(Dp, F, 0.2);
      if (st >= 3) g += arcNear(Ep, F, 0.2) + dot(F) + lbl(F, "F", 12, 6);
      if (st >= 4) g += seg(B, Hf, "acc") + seg(Hf, F, "ln dash") + rightM(Hf, Ep, B, 10) + dot(Hf) + lbl(Hf, "H", -12, -8);
      if (st >= 5) g += seg(B, Dp) + seg(B, Ep) + seg(F, Dp) + seg(F, Ep);
      const outside = B.x < A.x || B.x > C.x;
      cap = ["Start with △ABC. We will construct the altitude from B to side AC" + (outside ? ". B is beyond the end of AC, so we use AC extended (dashed line)." : "."),
        "Step 1: Put the compass point on B. Draw an arc that crosses line AC at two points, D and E.",
        "Step 2: Open the compass to more than half of DE. Put the point on D and draw an arc below line AC.",
        "Step 3: Keep the same width. Put the point on E and draw an arc that crosses the first one at F.",
        `Step 4: Lay the straightedge on B and F and draw BH. BH ⊥ AC (m∠BHC = 90°). BH is the altitude from B${outside ? "; it meets AC extended, outside the triangle" : ""}.`,
        "Why it works: B is the same distance from D and E (one compass width), and so is F (another compass width). Points that are equally far from D and E lie on the perpendicular bisector of DE, so BF ⊥ DE, which is line AC."][st];
    } else {
      if (st >= 1) { const a0 = angTo(B, Db), a1 = angTo(B, Eb); g += arcAt(B, rr, Math.min(a0, a1) - 0.15, Math.max(a0, a1) + 0.15, "ln dash") + dot(Db) + dot(Eb) + lbl(Db, "D", -14, 0) + lbl(Eb, "E", 14, 0); }
      if (st >= 2) g += arcNear(Db, Fb, 0.25);
      if (st >= 3) g += arcNear(Eb, Fb, 0.25) + dot(Fb) + lbl(Fb, "F", 12, 4);
      if (st >= 4) g += seg(B, Gb, "acc") + arcM(B, A, Gb, 30, "am hot") + arcM(B, Gb, C, 30, "am hot") + dot(Gb) + lbl(Gb, "G", 0, 18);
      if (st >= 5) g += seg(Db, Fb) + seg(Eb, Fb) + ticks(B, Db, 1) + ticks(B, Eb, 1) + ticks(Db, Fb, 2) + ticks(Eb, Fb, 2);
      const half = deg(Math.acos(((A.x - B.x) * (C.x - B.x) + (A.y - B.y) * (C.y - B.y)) / (bA * bC))) / 2;
      cap = ["Start with △ABC. We will construct the bisector of ∠B.",
        "Step 1: Put the compass point on B. Draw an arc that crosses BA at D and BC at E.",
        "Step 2: Keep the same width. Put the point on D and draw an arc inside the angle.",
        "Step 3: Keep the same width. Put the point on E and draw an arc that crosses the first one at F.",
        `Step 4: Draw ray BF. It meets AC at G. BG is the angle bisector: m∠ABG = m∠GBC ≈ ${nf(r1(half))}°.`,
        "Why it works: BD ≅ BE and DF ≅ EF (same compass width), and BF ≅ BF (reflexive property). So △BDF ≅ △BEF by SSS, and ∠DBF ≅ ∠EBF by CPCTC."][st];
    }
    $("[data-g]", el).innerHTML = `<svg viewBox="-70 0 500 345" class="fig" style="max-width:560px" role="img" aria-label="Compass and straightedge construction on triangle ABC">${g}</svg>`;
    $("[data-n]", el).textContent = el.S.all ? "All four lines" : st === 0 ? "Start" : st === n - 1 ? "Why it works" : `Step ${st} of ${n - 2}`;
    say(el, cap);
  },
  act(el, n) {
    const t = $(`input[name="${el.id}-t"]:checked`, el).value;
    if (n === "all") { el.S.all = !el.S.all; }
    else { el.S.all = false; el.S.step = Math.max(0, Math.min(C4[t].n - 1, el.S.step + (n === "next" ? 1 : -1))); }
    this.draw(el);
  }
};

// ===== 5.2 Construction stepper =====
const CONSTRUCT_STEPS = [
  "Start with ∠P. We will split it into two congruent angles with only a compass and a straightedge.",
  "Step 1: Put the compass point on P. Draw an arc that crosses both rays. Label the crossings A and B.",
  "Step 2: Keep the same compass width. Put the point on A and draw an arc inside the angle.",
  "Step 3: Keep the same width. Put the point on B and draw an arc that crosses the first one. Label the crossing M.",
  "Step 4: Draw ray PM. It bisects ∠P: m∠APM = m∠BPM.",
  "Why it works: PA ≅ PB and AM ≅ BM (same compass width), and PM ≅ PM (reflexive property). So △PAM ≅ △PBM by SSS, and ∠APM ≅ ∠BPM by CPCTC."];
IX.construct = {
  html: id => ixBox(id, "construct", "Construct an angle bisector, step by step", `<div data-g></div>
    <div class="sliders">${slider(id, "t", "Size of ∠P (°)", 40, 140, 5, 70)}</div>
    <div class="row"><button type="button" class="btn sm" data-act="back">← Back</button><button type="button" class="btn sm primary" data-act="next">Next step →</button><span class="muted small" data-n></span></div>${sayBox()}`),
  init(el) { el.S = { step: 0 }; },
  draw(el) {
    const st = el.S.step, t = sv(el, "t"), Pv = P(50, 150), r = 105, hf = rad(t / 2);
    const A = P(Pv.x + r * Math.cos(hf), Pv.y - r * Math.sin(hf)), B = P(Pv.x + r * Math.cos(hf), Pv.y + r * Math.sin(hf)), M = P(Pv.x + 2 * r * Math.cos(hf), Pv.y);
    const far = d => P(Pv.x + 260 * Math.cos(d), Pv.y + 260 * Math.sin(d)), angA = Math.atan2(M.y - A.y, M.x - A.x), angB = Math.atan2(M.y - B.y, M.x - B.x);
    let g = seg(Pv, far(-hf)) + seg(Pv, far(hf)) + dot(Pv) + lbl(Pv, "P", -14, 6);
    if (st >= 1) g += arcAt(Pv, r, -hf - 0.25, hf + 0.25, "ln dash") + dot(A) + dot(B) + lbl(A, "A", -6, -12) + lbl(B, "B", -6, 24);
    if (st >= 2) g += arcAt(A, r, angA - 0.35, angA + 0.35, "ln dash");
    if (st >= 3) g += arcAt(B, r, angB - 0.35, angB + 0.35, "ln dash") + dot(M) + lbl(M, "M", 12, -8);
    if (st >= 4) g += seg(Pv, P(380, Pv.y), "acc") + arcM(Pv, A, M, 34, "am hot") + arcM(Pv, M, B, 34, "am hot");
    if (st >= 5) g += seg(A, M) + seg(B, M) + ticks(Pv, A, 1) + ticks(Pv, B, 1) + ticks(A, M, 2) + ticks(B, M, 2);
    $("[data-g]", el).innerHTML = svgWrap(390, 300, g, "Angle bisector construction", 460);
    $("[data-n]", el).textContent = `Step ${st} of 5`;
    say(el, CONSTRUCT_STEPS[st] + (st >= 4 ? ` Here each half is ${nf(t / 2)}°.` : ""));
  },
  act(el, n) { el.S.step = Math.max(0, Math.min(5, el.S.step + (n === "next" ? 1 : -1))); this.draw(el); }
};

// ===== 5.3 / 5.4 Proof builder =====
const REASONS = ["Given", "Reflexive property", "Definition of midpoint", "Definition of angle bisector", "Vertical angles are congruent", "Perpendicular lines form congruent right angles", "SSS", "SAS", "ASA", "HL", "CPCTC"];
IX.proof = {
  html(id, l) {
    const T = l.proofTask;
    return ixBox(id, "proof", "Proof builder: choose the reason for each statement", `
      <span data-lid="${l.id}" hidden></span>${T.fig ? T.fig() : ""}<p class="q">${T.cap}</p>
      <div class="tbl-wrap"><table class="proof"><thead><tr><th scope="col">Statements</th><th scope="col">Reasons</th></tr></thead><tbody>
      ${T.rows.map(([st], i) => `<tr><td>${i + 1}. ${st}</td><td><select data-r="${i}" aria-label="Reason for statement ${i + 1}"><option value="">choose a reason</option>${REASONS.map(r => `<option>${r}</option>`).join("")}</select></td></tr>`).join("")}
      </tbody></table></div>
      <div class="row"><button type="button" class="btn sm primary" data-act="check">Check my proof</button><button type="button" class="btn sm" data-act="show">Show the answers</button></div>${sayBox()}`, true);
  },
  task(el) { const id = $("[data-lid]", el).dataset.lid; return HUB.weeks.flatMap(w => w.lessons || []).find(x => x.id === id).proofTask; },
  act(el, n) {
    const T = this.task(el), sels = $$("select[data-r]", el);
    if (n === "show") { sels.forEach((s, i) => { s.value = T.rows[i][1]; s.classList.remove("no"); s.classList.add("ok"); }); return say(el, "Here is the complete proof. Read each reason and see why it fits.", true); }
    let right = 0, blank = 0;
    sels.forEach((s, i) => { if (!s.value) { blank++; s.classList.remove("ok", "no"); return; } const ok = s.value === T.rows[i][1]; if (ok) right++; s.classList.toggle("ok", ok); s.classList.toggle("no", !ok); });
    say(el, right === T.rows.length ? "Every reason is correct. Your proof is complete." : `${right} of ${T.rows.length} reasons are correct${blank ? `, ${blank} not chosen yet` : ""}. Remember: CPCTC can only come after the triangles are proven congruent.`, right === T.rows.length);
  }
};
// Small labelled figure for a proof: points {P: [x, y]}, sides [["P", "A", ticks]], arcs [["B", "A", "D", count]]
function proofFig(pp, sides, arcs = [], extra = "") {
  const Q = {}; Object.entries(pp).forEach(([k, v]) => { Q[k] = P(...v); });
  let s = ""; sides.forEach(([a, b, n]) => { s += seg(Q[a], Q[b]) + (n ? ticks(Q[a], Q[b], n) : ""); });
  arcs.forEach(([v, a, b, n]) => { for (let i = 0; i < n; i++) s += arcM(Q[v], Q[a], Q[b], 22 + i * 6, "am hot"); });
  const cx = Object.values(Q).reduce((t, p) => t + p.x, 0) / Object.keys(Q).length, cy = Object.values(Q).reduce((t, p) => t + p.y, 0) / Object.keys(Q).length;
  Object.entries(Q).forEach(([k, p]) => { const u = unit(sub(p, P(cx, cy))); s += dot(p, 3.5) + lbl(P(p.x + u.x * 16, p.y + u.y * 16 + 6), k, 0, 0, "lbl sm"); });
  return svgWrap(320, 210, s + extra, "Figure for the proof", 340);
}

</script>
<script>
// Interactives for quadratic functions (Weeks 7 and 8).

const sqrtTxt = v => { const r = Math.sqrt(v); return near(r, Math.round(r), 1e-9) ? nf(Math.round(r)) : `√${nf(v)} ≈ ${nf(Math.round(r * 100) / 100)}`; };

// ===== 7.1 Match the target =====
IX.target = {
  html: id => ixBox(id, "target", "Match the target parabola", `
    <p class="muted small">Move the sliders until your parabola (solid) sits exactly on the target (dashed).</p>
    <div data-g></div>
    <div class="sliders s3">${slider(id, "a", "a", -3, 3, 0.5, 1, "shape and opening")}${slider(id, "h", "h", -4, 4, 1, 0, "left or right")}${slider(id, "k", "k", -4, 4, 1, 0, "up or down")}</div>
    <div class="row"><button type="button" class="btn sm" data-act="new">New target</button><button type="button" class="btn sm" data-act="show">Show the target's equation</button><span class="muted small" data-score></span></div>
    ${sayBox()}`),
  init(el) { el.S = { found: 0 }; this.newT(el); },
  newT(el) {
    let t; do { t = { a: pick([-2, -1, -0.5, 0.5, 1, 2]), h: pick([-3, -2, -1, 1, 2, 3]), k: pick([-4, -3, -2, -1, 1, 2, 3, 4]) }; }
    while (el.S.t && t.a === el.S.t.a && t.h === el.S.t.h && t.k === el.S.t.k);
    el.S.t = t; el.S.done = false;
  },
  draw(el) {
    const a = sv(el, "a"), h = sv(el, "h"), k = sv(el, "k"), t = el.S.t;
    const g = G({ W: 320, H: 320, x0: -6, x1: 6, y0: -8, y1: 8, id: el.id });
    $("[data-g]", el).innerHTML = g.svg(g.grid() + g.clipOpen() + g.curve(x => t.a * (x - t.h) ** 2 + t.k, "target") +
      (a ? g.curve(x => a * (x - h) ** 2 + k) + g.pt(h, k) : g.hline(k, "curve")) + "</g>", "Target parabola and your parabola");
    const vOK = h === t.h && k === t.k, aOK = a === t.a;
    if (vOK && aOK) {
      if (!el.S.done) { el.S.done = true; el.S.found++; }
      say(el, `<b>Matched!</b> The target is ${vform(t.a, t.h, t.k)}. Vertex (${nf(t.h)}, ${nf(t.k)}), axis x = ${nf(t.h)}, opens ${t.a > 0 ? "upward" : "downward"}. Press <b>New target</b> for another.`, true);
    } else say(el, `${a === 0 ? "a cannot be 0: that is a line, not a parabola.<br>" : ""}Your graph: ${a ? vform(a, h, k) : "y = " + nf(k)}<br>Vertex in place: ${vOK ? "yes ✓" : "not yet"} · Shape and opening: ${aOK ? "yes ✓" : "not yet"}`);
    $("[data-score]", el).textContent = `Targets matched: ${el.S.found}`;
  },
  act(el, n) {
    if (n === "new") { this.newT(el); this.draw(el); }
    if (n === "show") { const t = el.S.t; say(el, `Target: ${vform(t.a, t.h, t.k)}. Now set a = ${nf(t.a)}, h = ${nf(t.h)}, k = ${nf(t.k)}.`); }
  }
};

// ===== 7.2 Max, min, zeros, increasing and decreasing =====
IX.zeros = {
  html: id => ixBox(id, "zeros", "Watch the zeros and the turning point", `
    <div data-g></div>
    <p class="legend small"><span class="lg dec"></span> decreasing (going down, left to right) <span class="lg inc"></span> increasing (going up)</p>
    <div class="sliders s3">${slider(id, "a", "a", -2, 2, 0.5, 1)}${slider(id, "h", "h", -4, 4, 1, 3)}${slider(id, "k", "k", -6, 6, 1, -4)}</div>
    ${sayBox()}`),
  draw(el) {
    const a = sv(el, "a"), h = sv(el, "h"), k = sv(el, "k");
    const g = G({ W: 320, H: 320, x0: -7, x1: 9, y0: -8, y1: 8, id: el.id });
    if (!a) { $("[data-g]", el).innerHTML = g.svg(g.grid() + g.clipOpen() + g.hline(k, "curve") + "</g>", "A horizontal line"); say(el, "a cannot be 0: then the graph is a line, not a parabola."); return; }
    const f = x => a * (x - h) ** 2 + k, v = -k / a;
    let zs = [];
    if (near(v, 0, 1e-9)) zs = [h]; else if (v > 0) zs = [h - Math.sqrt(v), h + Math.sqrt(v)];
    const left = a > 0 ? "dec" : "inc", right = a > 0 ? "inc" : "dec";
    let s = g.grid() + g.clipOpen() + g.vline(h) + g.curve(f, "curve " + left, -7, h) + g.curve(f, "curve " + right, h, 9) + "</g>";
    zs.forEach(z => { s += g.pt(z, 0, "pt zero", 5); });
    s += g.pt(h, k) + g.label(h, k, a > 0 ? "min" : "max", 0, a > 0 ? 20 : -10);
    $("[data-g]", el).innerHTML = g.svg(s, "Parabola with its vertex and zeros");
    const opens = a > 0 ? "upward, so the vertex is the lowest point" : "downward, so the vertex is the highest point";
    let zt;
    if (zs.length === 1) zt = `0 = ${coefA(a)}(x${signed(-h)})²: the vertex touches the x-axis, so there is one zero, x = ${nf(h)}.`;
    else if (!zs.length) zt = `0 = ${vform(a, h, k).slice(4)} → (x${signed(-h)})² = ${nf(v)}. A square is never negative, so there are <b>no real zeros</b>.`;
    else zt = `0 = ${vform(a, h, k).slice(4)} → (x${signed(-h)})² = ${nf(v)} → x = ${nf(h)} ± ${sqrtTxt(v)} → <b>x = ${nf(Math.round(zs[0] * 100) / 100)} or x = ${nf(Math.round(zs[1] * 100) / 100)}</b>`;
    say(el, `<b>${vform(a, h, k)}</b><br>Opens ${opens}: ${a > 0 ? "minimum" : "maximum"} value <b>${nf(k)}</b> at x = ${nf(h)}.<br>Zeros: ${zt}<br>${a > 0 ? "Decreasing" : "Increasing"} for x &lt; ${nf(h)}; ${a > 0 ? "increasing" : "decreasing"} for x &gt; ${nf(h)}.`);
  }
};

// ===== 7.3 Algebra tiles: complete the square =====
IX.tiles = {
  html: id => ixBox(id, "tiles", "Complete the square with tiles", `
    <div data-g></div>
    <div class="sliders">${slider(id, "b", "Coefficient of x, b", 2, 12, 2, 6)}</div>
    <div class="row"><label for="${id}-sg">Sign of the x-term</label><select id="${id}-sg" data-sg><option value="1">+ bx</option><option value="-1">− bx</option></select></div>
    <div class="row" data-step>${numIn(id, "c", "Number that completes the square:")}<button type="button" class="btn sm primary" data-act="check">Check</button></div>
    ${sayBox()}`),
  draw(el, e) {
    const b = sv(el, "b"), sg = +$("[data-sg]", el).value, hb = b / 2;
    el.S = el.S || { done: false };
    if (e && e.target && e.target.matches("[data-k], [data-sg]")) { el.S.done = false; const i = $("[data-in=c]", el); i.value = ""; i.classList.remove("ok", "no"); }
    const u = 22, X0 = 50, Y0 = 34, s = 150, w = hb * u;
    const done = el.S.done;
    let g = `<rect class="tile" x="${X0}" y="${Y0}" width="${s}" height="${s}"/><rect class="tile" x="${X0 + s}" y="${Y0}" width="${w}" height="${s}"/>
      <rect class="tile" x="${X0}" y="${Y0 + s}" width="${s}" height="${w}"/><rect class="tile miss${done ? " filled" : ""}" x="${X0 + s}" y="${Y0 + s}" width="${w}" height="${w}"/>
      ${txt(X0 + s / 2, Y0 + s / 2 + 7, "x²", "lbl")}${txt(X0 + s + w / 2, Y0 + s / 2 + 6, `${nf(hb)}x`, "lbl sm")}${txt(X0 + s / 2, Y0 + s + w / 2 + 6, `${nf(hb)}x`, "lbl sm")}
      ${txt(X0 + s + w / 2, Y0 + s + w / 2 + 6, done ? nf(hb * hb) : "?", "lbl sm")}
      ${txt(X0 + s / 2, Y0 - 8, "x")}${txt(X0 + s + w / 2, Y0 - 8, nf(hb))}${txt(X0 - 8, Y0 + s / 2, "x", "cap", "end")}${txt(X0 - 8, Y0 + s + w / 2 + 4, nf(hb), "cap", "end")}`;
    $("[data-g]", el).innerHTML = `<svg viewBox="0 0 ${X0 + s + 6 * u + 20} ${Y0 + s + 6 * u + 16}" class="fig" style="max-width:420px" role="img" aria-label="Tiles: x squared, two strips of ${nf(hb)}x, and a missing corner">${g}</svg>`;
    const sgn = sg > 0 ? "+" : "−";
    if (!done) say(el, `x² ${sgn} ${b}x + <b>?</b>: half of ${b} is ${nf(hb)}. What number fills the corner?`);
    else say(el, `x² ${sgn} ${b}x + ${nf(hb * hb)} = (x ${sgn} ${nf(hb)})². The corner is (${nf(hb)})² = ${nf(hb * hb)}: always (half of b)².${sg < 0 ? " For a negative x-term, the corner is still positive." : ""}`, true);
  },
  act(el, n) {
    if (n !== "check") return;
    const b = sv(el, "b"), v = inV(el, "c"), ok = near(v, (b / 2) ** 2);
    mark(el, "c", ok);
    if (ok) { el.S.done = true; this.draw(el); }
    else say(el, isNaN(v) ? "Type a number first." : `Not yet. Take half of ${b}, then square it.`, false);
  }
};

// ===== 7.4 Form converter: standard ↔ vertex =====
IX.converter = {
  html: id => ixBox(id, "converter", "Form converter: standard form ↔ vertex form", `
    <fieldset class="seg"><legend class="sr-only">Direction</legend>
      <label><input type="radio" name="${id}-m" value="s2v" checked> Standard → vertex</label>
      <label><input type="radio" name="${id}-m" value="v2s"> Vertex → standard</label></fieldset>
    <p class="q" data-prob></p>
    <div class="row" data-step data-ins></div>
    <div class="row"><button type="button" class="btn sm primary" data-act="check">Check</button><button type="button" class="btn sm" data-act="steps">Show the steps</button><button type="button" class="btn sm" data-act="new">New problem</button></div>
    ${sayBox()}<ol class="steps-list" data-steps hidden></ol><div data-g></div>`, true),
  init(el) { this.newP(el); },
  mode: el => $(`input[name="${el.id}-m"]:checked`, el).value,
  newP(el) {
    const a = pick([1, 1, 1, 2, -1, -2, 3]), h = pick([-4, -3, -2, -1, 1, 2, 3, 4]), k = pick([-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5]);
    el.S = { a, h, k, b: -2 * a * h, c: a * h * h + k, solved: false };
    this.render(el);
  },
  render(el) {
    const S = el.S, m = this.mode(el), id = el.id;
    $("[data-prob]", el).innerHTML = m === "s2v" ? `Write <b>${sform(S.a, S.b, S.c)}</b> in vertex form. Find h and k.` : `Write <b>${vform(S.a, S.h, S.k)}</b> in standard form y = ${coefA(S.a)}x² + bx + c. Find b and c.`;
    $("[data-ins]", el).innerHTML = m === "s2v" ? numIn(id, "p", "h =") + numIn(id, "q", "k =") : numIn(id, "p", "b =") + numIn(id, "q", "c =");
    $("[data-steps]", el).hidden = true; $("[data-g]", el).innerHTML = ""; say(el, "");
  },
  draw(el, e) { if (e && e.target && e.target.type === "radio") { el.S.solved = false; this.render(el); } },
  steps(el) {
    const { a, h, k, b, c } = el.S, m = this.mode(el), p = b / a, h2 = h * h;
    const fx = (q) => `x²${q < 0 ? " − " : " + "}${nf(Math.abs(q))}x`;
    const A = a === 1 ? "" : a === -1 ? "−" : nf(a);
    if (m === "s2v") return [
      a === 1 ? `Group the x-terms: y = (${fx(b)})${signed(c)}` : `Factor a = ${nf(a)} out of the x-terms: y = ${A}(${fx(p)})${signed(c)}`,
      `Take half of ${nf(p)} and square it: (${nf(p)} ÷ 2)² = ${nf(h2)}`,
      `Add and subtract ${nf(h2)} inside: y = ${A}(${fx(p)} + ${nf(h2)} − ${nf(h2)})${signed(c)}`,
      a === 1 ? `Write the perfect square trinomial as a square: y = (x${signed(-h)})²${signed(-h2)}${signed(c)}` : `Write the square, then move −${nf(h2)} out; it is multiplied by ${nf(a)}, so it becomes ${nf(-a * h2)}: y = ${A}(x${signed(-h)})²${signed(-a * h2)}${signed(c)}`,
      `Combine the constants: <b>${vform(a, h, k)}</b>`,
      `Vertex (${nf(h)}, ${nf(k)}). Check: h = −b ÷ (2a) = ${nf(-b)} ÷ ${nf(2 * a)} = ${nf(h)} ✓`];
    return [
      `Expand the square: (x${signed(-h)})² = x²${signed(-2 * h)}x + ${nf(h2)}`,
      `Multiply by a = ${nf(a)}: ${A}(x²${signed(-2 * h)}x + ${nf(h2)}) = ${nf(a) === "1" ? "" : A}x²${signed(b)}x${signed(a * h2)}`,
      `Add k = ${nf(k)}: c = ${nf(a * h2)}${signed(k)} = ${nf(c)}`,
      `<b>${sform(a, b, c)}</b>. Check: −b ÷ (2a) = ${nf(-b)} ÷ ${nf(2 * a)} = ${nf(h)}, the same h ✓`];
  },
  graph(el) {
    const { a, h, k, b, c } = el.S, g = G({ W: 320, H: 280, x0: -8, x1: 8, y0: -12, y1: 12, id: el.id });
    $("[data-g]", el).innerHTML = g.svg(g.grid() + g.clipOpen() + g.vline(h) + g.curve(x => a * x * x + b * x + c) + g.pt(h, k) + g.label(h, k, `(${nf(h)}, ${nf(k)})`, 0, a > 0 ? 22 : -10) + "</g>",
      "Graph of the function", "max-width:420px") + `<p class="muted small">Both forms give this same parabola.</p>`;
  },
  act(el, n) {
    if (n === "new") return this.newP(el);
    if (n === "steps") { const ol = $("[data-steps]", el); ol.innerHTML = this.steps(el).map(s => `<li>${s}</li>`).join(""); ol.hidden = false; this.graph(el); return; }
    if (n === "check") {
      const S = el.S, m = this.mode(el), p = inV(el, "p"), q = inV(el, "q");
      if (isNaN(p) || isNaN(q)) return say(el, "Type both numbers first.", false);
      const okP = near(p, m === "s2v" ? S.h : S.b), okQ = near(q, m === "s2v" ? S.k : S.c);
      mark(el, "p", okP); mark(el, "q", okQ);
      if (okP && okQ) { say(el, `Correct. ${sform(S.a, S.b, S.c)} and ${vform(S.a, S.h, S.k)} are the same function. Press <b>New problem</b> for another.`, true); this.graph(el); }
      else say(el, m === "s2v" ? `Not yet. ${okP ? "h is right. " : "Watch the sign: x − 3 means h = 3. "}${okQ ? "k is right." : "Check the constant: you subtract a × (half of b/a)²."} Try again or press <b>Show the steps</b>.`
        : `Not yet. ${okP ? "b is right. " : "b = −2ah. "}${okQ ? "c is right." : "c = a·h² + k."} Try again or press <b>Show the steps</b>.`, false);
    }
  }
};

// ===== 7.4 Form match =====
const FORM_PAIRS = [["y = x² − 6x + 5", "y = (x − 3)² − 4"], ["y = 2x² − 8x + 11", "y = 2(x − 2)² + 3"], ["y = −x² + 6x − 5", "y = −(x − 3)² + 4"],
  ["y = x² + 4x − 1", "y = (x + 2)² − 5"], ["y = −2x² + 20x", "y = −2(x − 5)² + 50"], ["y = x² − 4x + 4", "y = (x − 2)²"]];
IX.match = {
  html(id) {
    const right = shuffle(FORM_PAIRS.map((p, i) => [p[1], i]));
    return ixBox(id, "match", "Form match: pair each standard form with its vertex form", `
      <p class="muted small">Tap a standard form, then the vertex form of the same function. Expand the vertex form to check.</p>
      <div class="match-cols"><div role="group" aria-label="Standard forms">${FORM_PAIRS.map((p, i) => `<button type="button" class="mbtn" data-act="L" data-i="${i}" aria-pressed="false">${p[0]}</button>`).join("")}</div>
      <div role="group" aria-label="Vertex forms">${right.map(([t, i]) => `<button type="button" class="mbtn" data-act="R" data-i="${i}">${t}</button>`).join("")}</div></div>
      <div class="row"><button type="button" class="btn sm" data-act="reset">Start over</button><span class="muted small" data-score>Matched: 0 of 6</span></div>${sayBox()}`, true);
  },
  init(el) { el.S = { sel: null, n: 0 }; },
  act(el, n, b) {
    if (n === "reset") { const box = el.parentNode; const id = el.id; el.outerHTML = this.html(id); const ne = $(`#${id}`, box); this.init(ne); return; }
    if (b.classList.contains("done")) return;
    if (n === "L") { $$('[data-act="L"]', el).forEach(x => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); el.S.sel = +b.dataset.i; say(el, `Now tap the vertex form of ${FORM_PAIRS[el.S.sel][0]}.`); return; }
    if (n === "R") {

        el.S.n++; el.S.sel = null;

      } else say(el, `Not a pair. Expand ${b.textContent} and compare it with ${FORM_PAIRS[i][0]}.`, false);

    }
  }
};

// ===== 8.1 Plot it yourself =====
const PLOT_FUNCS = [
  { t: "f(x) = x² − 6x + 5", f: x => x * x - 6 * x + 5, xs: [0, 1, 2, 3, 4, 5, 6] },
  { t: "f(x) = x² − 2x − 3", f: x => x * x - 2 * x - 3, xs: [-1, 0, 1, 2, 3] },
  { t: "f(x) = x² + 2x − 3", f: x => x * x + 2 * x - 3, xs: [-3, -2, -1, 0, 1] },
  { t: "Ditch: y = x² − 4x", f: x => x * x - 4 * x, xs: [0, 1, 2, 3, 4] }];
IX.plottable = {
  html: id => ixBox(id, "plottable", "Plot it yourself: table of values to graph", `
    <div class="row"><label for="${id}-f">Function</label><select id="${id}-f" data-fsel>${PLOT_FUNCS.map((p, i) => `<option value="${i}">${p.t}</option>`).join("")}</select></div>
    <div data-table></div>

    ${sayBox()}<div data-g></div>`, true),
  init(el) { this.reset(el); },
  reset(el) {
    const P = PLOT_FUNCS[+$("[data-fsel]", el).value];
    el.S = { P, ok: P.xs.map(() => false), mode: "" };
    $("[data-table]", el).innerHTML = `<div class="tbl-wrap"><table class="tov ix-tov"><caption>Type each y-value. Use parentheses for negative x: (−1)² = 1.</caption><tbody>
      <tr><th scope="row">x</th>${P.xs.map(x => `<td>${nf(x)}</td>`).join("")}</tr>
      <tr><th scope="row">y</th>${P.xs.map((x, i) => `<td><input data-in="y${i}" aria-label="y when x = ${nf(x)}" inputmode="decimal" autocomplete="off"></td>`).join("")}</tr></tbody></table></div>`;
    say(el, "Fill in the table, then press <b>Check my table</b>. Correct points appear on the grid.");
  },
  draw(el, e) { if (e && e.target && e.target.matches("[data-fsel]")) this.reset(el); this.graph(el); },
  graph(el) {
    const { P, ok, mode } = el.S, ys = P.xs.map(P.f);
    const x0 = Math.min(...P.xs) - 1, x1 = Math.max(...P.xs) + 1, y0 = Math.min(...ys) - 1, y1 = Math.max(...ys) + 1;
    const g = G({ W: 340, H: 300, x0, x1, y0, y1, id: el.id, gx: 1, gy: 1, nx: 1, ny: 2 });
    let s = g.grid() + g.clipOpen();
    if (mode === "segs") s += g.poly(P.xs.map((x, i) => [x, ys[i]]), "acc-poly");
    if (mode === "smooth") s += g.curve(P.f, "curve", x0, x1);
    if (mode === "segs") { const xm = (P.xs[Math.floor(P.xs.length / 2) - 1] + P.xs[Math.floor(P.xs.length / 2)]) / 2; s += g.curve(P.f, "parent", x0, x1) + g.pt(xm, P.f(xm), "pt zero", 5); }
    s += "</g>" + P.xs.map((x, i) => ok[i] ? g.pt(x, ys[i], "pt", 5) : "").join("");
    $("[data-g]", el).innerHTML = g.svg(s, "Your plotted points", "max-width:460px");
  },
  act(el, n) {
    const { P, ok } = el.S, ys = P.xs.map(P.f), all = () => ok.every(Boolean);
    if (n === "check") {
      let blank = 0;
      P.xs.forEach((x, i) => { const v = inV(el, "y" + i); if (isNaN(v)) { blank++; return; } ok[i] = near(v, ys[i]); mark(el, "y" + i, ok[i]); });
      this.graph(el);
      if (all()) {
        const iv = ys.indexOf(Math.min(...ys)), xv = P.xs[iv], pairs = [];
        P.xs.forEach((x, i) => P.xs.forEach((x2, j) => { if (j > i && ys[i] === ys[j]) pairs.push(`(${nf(x)}, ${nf(ys[i])}) & (${nf(x2)}, ${nf(ys[j])})`); }));
        say(el, `All points are correct. Vertex (${nf(xv)}, ${nf(ys[iv])}) · axis x = ${nf(xv)} · opens upward · minimum ${nf(ys[iv])}<br>Symmetric pairs: ${pairs.join("; ")}.<br>Now join the points. Try both buttons.`, true);
      } else say(el, `${ok.filter(Boolean).length} of ${ok.length} correct${blank ? `, ${blank} blank` : ""}. Red boxes need another look: square first, then multiply, then add.`, false);
    }
    if (n === "segs" || n === "smooth") {
      if (!all()) return say(el, "Complete and check the whole table first.", false);
      el.S.mode = n; this.graph(el);
      if (n === "segs") {
        const xm = (P.xs[Math.floor(P.xs.length / 2) - 1] + P.xs[Math.floor(P.xs.length / 2)]) / 2;
        say(el, `Straight segments make sharp corners. Check x = ${nf(xm)}: the function gives y = ${nf(P.f(xm))} (red dot), which is not on the segments. A parabola is one smooth curve.`, false);
      } else say(el, "Correct: one smooth curve through all the points, with no corners. The two sides match across the axis of symmetry.", true);
    }
  }
};

  init(el) { this.reset(el); },

    $("[data-nz]", el).value = ""; $("[data-zin]", el).hidden = true; $("[data-mirror]", el).hidden = true;
    const ps = $("[data-k=px]", el), hh = el.S.F.h; ps.min = hh - 2; ps.max = hh + 2; ps.value = hh - 2;
    const F = el.S.F; say(el, `Start with the vertex. Compare ${vform(F.a, F.h, F.k, "f(x)")} with f(x) = a(x − h)² + k.`);
  },
  zeros(F) { const v = -F.k / F.a; return v > 0 ? [F.h - Math.sqrt(v), F.h + Math.sqrt(v)] : []; },
  draw(el, e) {
    if (e && e.target) {
      if (e.target.matches("[data-fsel]")) this.reset(el);

    }
    const F = el.S.F, st = el.S.step, f = x => F.a * (x - F.h) ** 2 + F.k, yi = f(0);
    const x0 = F.h - 6, x1 = F.h + 6, ys = [F.k, yi, 0];

      $("[data-mir]", el).innerHTML = `(${nf(px)}, ${nf(f(px))}) reflects to (2(${nf(F.h)}) − (${nf(px)}), ${nf(f(px))}) = <b>(${nf(2 * F.h - px)}, ${nf(f(px))})</b>: same height, same distance from x = ${nf(F.h)}.`; }

  act(el, n) {

      } else {
        if (!z.length) return say(el, `Look again: (x${signed(-F.h)})² = ${nf(-F.k / F.a)}. Can a square be negative?`, false);
        const v = [inV(el, "z1"), inV(el, "z2")].sort((p, q) => p - q), ok = near(v[0], z[0]) && near(v[1], z[1]);

    }
  }

    $("[data-sl]", el).innerHTML = m === "a" ? slider(id, "v", "a", -3, 3, 0.5, 2) : m === "h" ? slider(id, "v", "h", -5, 5, 1, 3) : slider(id, "v", "k", -5, 5, 1, 2);
    const sel = (key, opts) => `<select data-sel="${key}" aria-label="${key}"><option value="">choose</option>${opts.map(o => `<option>${o}</option>`).join("")}</select>`;
    $("[data-sent]", el).innerHTML = m === "a" ? `Compared with y = x², the graph ${sel("dir", ["opens upward", "opens downward"])} and is ${sel("w", ["narrower", "wider", "the same width"])}.`
      : `Compared with y = x², the graph moves ${sel("n", ["1", "2", "3", "4", "5"])} unit(s) ${sel("d", m === "h" ? ["to the left", "to the right"] : ["up", "down"])}.`;
    say(el, "Move the slider, then complete the sentence.");
  },
  draw(el, e) {
    if (e && e.target && e.target.type === "radio") this.mode(el);
    const m = el.S.m, v = sv(el, "v");
    const a = m === "a" ? v : 1, h = m === "h" ? v : 0, k = m === "k" ? v : 0;
    const g = G({ W: 320, H: 300, x0: -7, x1: 7, y0: -8, y1: 8, id: el.id });
    $("[data-g]", el).innerHTML = g.svg(g.grid() + g.clipOpen() + g.curve(x => x * x, "parent") + (a ? g.curve(x => a * (x - h) ** 2 + k) + g.pt(h, k) : g.hline(0, "curve")) + "</g>", "y = x squared (dashed) and the changed graph")
      + `<p class="center"><b>${a ? vform(a, h, k) : "a = 0 is not a parabola"}</b> <span class="muted">(dashed: y = x²)</span></p>`;
  },
  act(el, n) {
    if (n !== "check") return;
    const m = el.S.m, v = sv(el, "v"), get = k => ($(`[data-sel="${k}"]`, el) || {}).value;
    if (m === "a") {
      if (!v) return say(el, "Move a away from 0 first.", false);
      const dir = v > 0 ? "opens upward" : "opens downward", w = Math.abs(v) > 1 ? "narrower" : Math.abs(v) < 1 ? "wider" : "the same width";
      if (!get("dir") || !get("w")) return say(el, "Choose both words first.", false);
      const ok = get("dir") === dir && get("w") === w;
      say(el, ok ? `Correct. a = ${nf(v)}: the sign gives the opening, and |a| ${Math.abs(v) > 1 ? "> 1 makes it narrower" : Math.abs(v) < 1 ? "< 1 makes it wider" : "= 1 keeps the width"}.` : `Not yet. Look at the sign of a for the opening, and at |a| compared with 1 for the width.`, ok);
    } else {
      if (!v) return say(el, "Move the slider away from 0 first.", false);
      if (!get("n") || !get("d")) return say(el, "Choose both parts first.", false);
      const d = m === "h" ? (v > 0 ? "to the right" : "to the left") : (v > 0 ? "up" : "down");
      const ok = +get("n") === Math.abs(v) && get("d") === d;
      say(el, ok ? `Correct. ${m === "h" ? `In (x${signed(-v)})², h = ${nf(v)}: the sign inside looks opposite, but the graph moves ${d}.` : `k = ${nf(v)} moves every point ${Math.abs(v)} unit(s) ${d}.`}` : `Not yet. ${m === "h" ? "Find the new vertex: its x is h. Watch the sign inside the parentheses." : "Find the new vertex: its y is k."}`, ok);
    }
  }
};

// ===== 8.3 Arch analyzer =====
const ARCHES = [
  { t: "Foundation Day arch, Siay NHS main gate", nm: "the Foundation Day arch", a: -0.5, h: 4, k: 8, unit: "units (1 unit = 0.5 m)", s: 0.5, u: "m" },
  { t: "Bamboo fiesta arch, barangay plaza", nm: "the bamboo fiesta arch", a: -1, h: 3, k: 9, unit: "units (1 unit = 0.5 m)", s: 0.5, u: "m" },
  { t: "Sprinkler jet, Gulayan sa Paaralan", nm: "the water from the sprinkler", a: -1, h: 2, k: 4, unit: "feet", s: 1, u: "ft" },
  { t: "Foundation Day stage arch", nm: "the stage arch", a: -1, h: 5, k: 25, unit: "decimeters", s: 1, u: "dm" }];
IX.arch = {
  html: id => ixBox(id, "arch", "Arch analyzer: from equation to real measurements", `
    <div class="row"><label for="${id}-c">Context</label><select id="${id}-c" data-csel>${ARCHES.map((c, i) => `<option value="${i}">${c.t}</option>`).join("")}</select></div>
    <p class="q" data-eq></p>
    <div class="row" data-step>${numIn(id, "f1", "Left foot x =", "4em")}${numIn(id, "f2", "Right foot x =", "4em")}${numIn(id, "ht", "Height =", "4em")}${numIn(id, "wd", "Width =", "4em")}<button type="button" class="btn sm primary" data-act="check">Check</button></div>
    <div class="row"><button type="button" class="btn sm" data-act="graph">Show the graph</button><label class="small"><input type="checkbox" data-cmp> Width check: compare with another value of a (same vertex)</label></div>
    ${sayBox()}<div data-g></div>`, true),
  init(el) { this.reset(el); },
  reset(el) {
    el.S = { C: ARCHES[+$("[data-csel]", el).value], showG: false }; const C = el.S.C;
    $("[data-eq]", el).innerHTML = `<b>${vform(C.a, C.h, C.k)}</b> · x is the distance from the left foot, y is the height, in ${C.unit}.`;
    $$("[data-in]", el).forEach(i => { i.value = ""; i.classList.remove("ok", "no"); });
    say(el, "Work from the equation first: find where the arch meets the ground (let y = 0), its height, and its width. The graph comes last, to check.");
  },
  draw(el, e) {
    if (e && e.target && e.target.matches("[data-csel]")) this.reset(el);
    const C = el.S.C, r = Math.sqrt(-C.k / C.a), a2 = C.a === -1 ? -0.5 : -1, r2 = Math.sqrt(-C.k / a2);
    if ($("[data-cmp]", el).checked) el.S.showG = true;
    if (!el.S.showG) { $("[data-g]", el).innerHTML = ""; return; }
    const R = Math.max(r, $("[data-cmp]", el).checked ? r2 : 0);
    const g = G({ W: 340, H: 300, x0: Math.floor(C.h - R - 1), x1: Math.ceil(C.h + R + 1), y0: -1, y1: C.k + 2, id: el.id, xl: "x", yl: "y" });
    let s = g.grid() + g.clipOpen();
    if ($("[data-cmp]", el).checked) s += g.curve(x => a2 * (x - C.h) ** 2 + C.k, "target", C.h - r2, C.h + r2);
    s += g.curve(x => C.a * (x - C.h) ** 2 + C.k, "curve", C.h - r, C.h + r) + "</g>" + g.pt(C.h, C.k) + g.label(C.h, C.k, `(${nf(C.h)}, ${nf(C.k)})`, 0, -10);
    $("[data-g]", el).innerHTML = g.svg(s, "The arch drawn between its two feet", "max-width:460px");
    if (e && e.target && e.target.matches("[data-cmp]")) {
      say(el, e.target.checked ? `Dashed: ${vform(a2, C.h, C.k)}, feet ${nf(Math.round(2 * r2 * 100) / 100)} units apart. Solid: feet ${nf(Math.round(2 * r * 100) / 100)} units apart. Same vertex; the smaller |a| gives the wider arch.` : "");
    }
  },
  act(el, n) {
    if (n === "graph") { el.S.showG = true; this.draw(el); return; }
    if (n !== "check") return;
    const C = el.S.C, r = Math.sqrt(-C.k / C.a), f = [inV(el, "f1"), inV(el, "f2")];
    const okF = near(Math.min(...f), C.h - r) && near(Math.max(...f), C.h + r), okH = near(inV(el, "ht"), C.k), okW = near(inV(el, "wd"), 2 * r);
    mark(el, "f1", okF); mark(el, "f2", okF); mark(el, "ht", okH); mark(el, "wd", okW);
    if (okF && okH && okW) { el.S.showG = true; this.draw(el); }
    if (okF && okH && okW) say(el, `Correct. 0 = ${vform(C.a, C.h, C.k).slice(4)} → (x${signed(-C.h)})² = ${nf(-C.k / C.a)} → x = ${nf(C.h - r)} or x = ${nf(C.h + r)}.<br><b>In context:</b> ${C.nm} rises from (${nf(C.h - r)}, 0) to its highest point (${nf(C.h)}, ${nf(C.k)}) and comes down at (${nf(C.h + r)}, 0). It is ${nf(C.k * C.s)} ${C.u} high and ${nf(2 * r * C.s)} ${C.u} wide.`, true);
    else say(el, `Not yet. ${okF ? "" : "Let y = 0, isolate the square, and take both square roots. "}${okH ? "" : "The height is the y-value of the vertex. "}${okW ? "" : "The width is the distance between the feet."}`, false);
  }
};

// ===== 8.4 Design studio =====
const STUDIO_CONTEXTS = [["Bamboo fiesta arch", "down"], ["Garden sprinkler jet", "down"], ["Satellite-dish cross-section", "up"], ["Solar-cooker reflector", "up"]];
const STUDIO_EQS = [{ a: -1, h: 3, k: 9 }, { a: -2, h: 2, k: 8 }, { a: 0.5, h: -2, k: -1 }, { a: 2, h: 1, k: -4 }];
IX.studio = {
  html: id => ixBox(id, "studio", "Design studio: plan your performance-task output", `
    <div data-step class="kstep"><b>1. Choose a context and an equation that fits it.</b>
      <label for="${id}-c">Context</label><select id="${id}-c" data-cx><option value="">choose</option>${STUDIO_CONTEXTS.map((c, i) => `<option value="${i}">${c[0]}</option>`).join("")}</select>
      <label for="${id}-e">Equation</label><select id="${id}-e" data-eqs><option value="">choose</option>${STUDIO_EQS.map((q, i) => `<option value="${i}">${vform(q.a, q.h, q.k)}</option>`).join("")}</select>
      <button type="button" class="btn sm primary" data-act="check1">Check</button></div>
    <div data-step="2" class="kstep" hidden><b>2. Parameters</b> ${numIn(id, "a", "a =", "4em")}${numIn(id, "h", "h =", "4em")}${numIn(id, "k", "k =", "4em")}<button type="button" class="btn sm primary" data-act="check2">Check</button></div>
    <div data-step="3" class="kstep" hidden><b>3. Four symmetric points</b><div data-pts></div><button type="button" class="btn sm primary" data-act="check3">Check</button></div>
    <div data-step="4" class="kstep" hidden><b>4. Explain your design</b>
      <label for="${id}-s1">The parabola represents …</label><textarea id="${id}-s1" rows="2" data-t></textarea>
      <label for="${id}-s2">The vertex represents …</label><textarea id="${id}-s2" rows="2" data-t></textarea>
      <label for="${id}-s3">Changing … would modify the design by …</label><textarea id="${id}-s3" rows="2" data-t></textarea>
      <button type="button" class="btn sm" data-act="copy">Copy my design</button></div>
    ${sayBox()}<div data-g></div>`, true),
  init(el) { el.S = { step: 1 }; say(el, "A dish or reflector must open upward (a > 0). An arch or a water jet must open downward (a < 0)."); },
  draw(el) {
    const S = el.S; if (!S.E) { $("[data-g]", el).innerHTML = ""; return; }
    const E = S.E, f = x => E.a * (x - E.h) ** 2 + E.k, xs = [E.h - 2, E.h - 1, E.h + 1, E.h + 2];
    const ys = xs.map(f).concat(E.k, 0);
    const g = G({ W: 340, H: 280, x0: E.h - 4, x1: E.h + 4, y0: Math.min(...ys) - 2, y1: Math.max(...ys) + 2, id: el.id, gx: 1, gy: 1, nx: 1, ny: 2 });
    let s = g.grid() + g.clipOpen() + (S.step > 2 ? g.vline(E.h) : "") + (S.step > 3 ? g.curve(f) : "") + "</g>";
    if (S.step > 2) s += g.pt(E.h, E.k) + g.label(E.h, E.k, `V(${nf(E.h)}, ${nf(E.k)})`, 0, E.a > 0 ? 22 : -10);
    if (S.ok) xs.forEach((x, i) => { if (S.ok[i]) s += g.pt(x, f(x), "pt"); });
    $("[data-g]", el).innerHTML = g.svg(s, "Your design graph", "max-width:460px");
  },
  act(el, n) {
    const S = el.S, id = el.id;
    if (n === "check1") {
      const ci = $("[data-cx]", el).value, ei = $("[data-eqs]", el).value;
      if (ci === "" || ei === "") return say(el, "Choose a context and an equation first.", false);
      const E = STUDIO_EQS[+ei], want = STUDIO_CONTEXTS[+ci][1], has = E.a > 0 ? "up" : "down";
      if (want !== has) return say(el, `A ${STUDIO_CONTEXTS[+ci][0].toLowerCase()} opens ${want === "up" ? "upward" : "downward"}, but a = ${nf(E.a)} makes this graph open ${has === "up" ? "upward" : "downward"}. Choose another equation.`, false);
      S.E = E; S.ctx = STUDIO_CONTEXTS[+ci][0]; S.step = 2; S.ok = null;
      $('[data-step="2"]', el).hidden = false; $(`#${id}-a`).focus();
      say(el, `Good match: a = ${nf(E.a)} ${E.a > 0 ? "> 0 opens upward" : "< 0 opens downward"}, like a ${S.ctx.toLowerCase()}. Now read a, h, and k.`, true);
    }
    if (n === "check2") {
      const E = S.E, ok = [near(inV(el, "a"), E.a), near(inV(el, "h"), E.h), near(inV(el, "k"), E.k)];
      ["a", "h", "k"].forEach((k, i) => mark(el, k, ok[i]));
      if (!ok.every(Boolean)) return say(el, "Not yet. Compare with y = a(x − h)² + k. Type ½ as 0.5. Watch the sign of h.", false);
      const xs = [E.h - 2, E.h - 1, E.h + 1, E.h + 2];
      $("[data-pts]", el).innerHTML = `<div class="tbl-wrap"><table class="tov ix-tov"><tbody><tr><th scope="row">x</th>${xs.map(x => `<td>${nf(x)}</td>`).join("")}</tr>
        <tr><th scope="row">y</th>${xs.map((x, i) => `<td><input data-in="p${i}" aria-label="y when x = ${nf(x)}" inputmode="decimal" autocomplete="off"></td>`).join("")}</tr></tbody></table></div>`;
      S.step = 3; $('[data-step="3"]', el).hidden = false; this.draw(el);
      say(el, `Vertex (${nf(E.h)}, ${nf(E.k)}), axis x = ${nf(E.h)}, ${Math.abs(E.a) > 1 ? "narrower than" : Math.abs(E.a) < 1 ? "wider than" : "same width as"} y = x². Now find the y-values: x-values the same distance from x = ${nf(E.h)} give equal y-values.`, true);
    }
    if (n === "check3") {
      const E = S.E, f = x => E.a * (x - E.h) ** 2 + E.k, xs = [E.h - 2, E.h - 1, E.h + 1, E.h + 2];
      S.ok = xs.map((x, i) => { const v = inV(el, "p" + i), ok = near(v, f(x)); mark(el, "p" + i, ok); return ok; });
      if (S.ok.every(Boolean)) { S.step = 4; $('[data-step="4"]', el).hidden = false; say(el, `All four points are correct, and the pairs have equal y-values. Your graph is ready. Write your three sentences, then copy them for your group's output.`, true); }
      else say(el, "Some points need another look: (x − h) first, square it, multiply by a, then add k.", false);
      this.draw(el);
    }
    if (n === "copy") {
      const E = S.E, t = $$("[data-t]", el).map(x => x.value.trim() || "(blank)");
      const text = [`Design: ${S.ctx}`, `Equation: ${vform(E.a, E.h, E.k)}`, `a = ${nf(E.a)}, h = ${nf(E.h)}, k = ${nf(E.k)}`, `Vertex (${nf(E.h)}, ${nf(E.k)}); axis x = ${nf(E.h)}; opens ${E.a > 0 ? "upward" : "downward"}`,
        `Symmetric points: ${[E.h - 2, E.h - 1, E.h + 1, E.h + 2].map(x => `(${nf(x)}, ${nf(E.a * (x - E.h) ** 2 + E.k)})`).join(", ")}`,
        `1. The parabola represents ${t[0]}`, `2. The vertex represents ${t[1]}`, `3. Changing ${t[2]}`].join("\n");
      try { navigator.clipboard.writeText(text).then(() => say(el, "Copied. Paste it into your group's notes.", true), () => say(el, "Copy did not work in this browser. Select the text and copy it yourself.", false)); }
      catch (_) { say(el, "Copy did not work in this browser.", false); }
    }
  }
};

<script>
// Progress saved in this browser only (localStorage).
// Nothing here is sent to a server or to the teacher.
// Saved: weekly Check scores, self-ratings (green/yellow/red), and written reflections.

const STORE_KEY = "m9hub";

const progress = {
  available() {
    try { const k = "__m9test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch (_) { return false; }
  },
  get() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (_) { return {}; }
  },
  set(fn) {
    try { const s = progress.get(); fn(s); localStorage.setItem(STORE_KEY, JSON.stringify(s)); return true; } catch (_) { return false; }
  },
  score(n) { return (progress.get().checks || {})[n]; },
  rating(n) { return (progress.get().reflect || {})[n]; },
  notes(n) { return (progress.get().notes || {})[n] || {}; },
  hasAny() {
    const s = progress.get();
    return ["checks", "reflect", "notes"].some(k => s[k] && Object.keys(s[k]).length);
  },
  clear() {
    try { localStorage.removeItem(STORE_KEY); return true; } catch (_) { return false; }
  }
};

// The "Your progress on this device" box, shown on the home page.
function progressPanelHTML() {
  const ok = progress.available();
  return `<section class="panel privacy" aria-labelledby="pp-h">
    <div class="panel-head"><div><span class="eyebrow">Your progress on this device</span><h2 id="pp-h">Where your answers are saved</h2></div></div>
    <ul class="plain">
      <li>There is no login. Your Check scores, self-ratings, and written reflections are saved <b>only in this browser on this device</b>. They are not sent to your teacher or to any server.</li>
      <li>Anyone who opens this site in the same browser can see them. <b>On a shared phone or school computer, clear your progress before you leave.</b></li>
      <li>If you switch phones or browsers, your saved progress does not move with you.</li>
      ${ok ? "" : `<li><b>Saving is turned off in this browser</b> (for example, in a private window), so your progress will not be kept after you close the page.</li>`}
    </ul>
    <div class="row"><button type="button" class="btn danger" data-clear-progress>Clear my progress</button>
      <p class="fb" data-clear-msg aria-live="polite"></p></div>
  </section>`;
}

<script>
// Activities: warm-ups, lessons, sorting tasks, practice, the weekly Check, and the reflection.

const findWeek = n => HUB.weeks.find(w => w.n === n);

// Reads a typed number; accepts −3, -3, 1,200 and 1.5
const num = v => {
  const m = String(v).replace(/[−–]/g, "-").replace(/,/g, "").match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
};

// Multiple-choice options as real radio buttons, labelled by the question.
const mc = (key, choices, labelId) => `<div class="choices" role="radiogroup"${labelId ? ` aria-labelledby="${labelId}"` : ""}>${choices.map((c, i) => `
    <label class="choice" for="${key}-${i}"><input type="radio" name="${key}" id="${key}-${i}" value="${i}"><span>${c}</span></label>`).join("")}</div>`;

const numInput = (key, unit) => `<div class="answer-row"><label class="ans-label" for="${key}-in">Your answer</label>
    <input class="ans" id="${key}-in" inputmode="decimal" autocomplete="off" aria-describedby="q-${key}"><span class="unit" aria-hidden="${unit ? "false" : "true"}">${unit || ""}</span></div>`;

function problemHTML(item, key, attr) {
  return `<form class="prob" ${attr} aria-labelledby="q-${key}"><p class="q" id="q-${key}">${item.q}</p>
    ${item.choices ? mc(key, item.choices, `q-${key}`) : numInput(key, item.unit)}
    <div class="row"><button class="btn primary" type="submit">Check</button><button class="btn" type="button" data-show="${key}" aria-controls="sol-${key}" aria-expanded="false">Show solution</button></div>
    <p class="fb" id="fb-${key}" aria-live="polite"></p><p class="sol" id="sol-${key}" hidden>${item.sol}</p></form>`;
}

function studyHTML(wk, prefix) {
  const s = wk.study;
  return `<div class="study">
    <div class="study-col"><h3 class="h4">Refresh before class</h3><ul>${s.refresh.map(r => `<li>${r}</li>`).join("")}</ul></div>
    <div class="study-col"><h3 class="h4">Words to know</h3><ul class="chips">${s.words.map(w => `<li class="chip">${w}</li>`).join("")}</ul></div>
    <div class="study-col warm"><h3 class="h4">Warm-up</h3>${problemHTML(s.warm, `${prefix}w${wk.n}`, `data-warm="${prefix}w${wk.n}"`)}</div>
  </div>`;
}

// Videos: a lesson lists supplementary videos in `videos`. Without one, the lesson says so plainly.
function lessonVideos(l) {
  const list = l.videos || (l.video ? [{ title: "Video lesson", url: l.video, source: "" }] : []);
  return list;
}
function videoHTML(l) {
  const list = lessonVideos(l);
  if (!list.length) return `<div class="video none"><span class="play" aria-hidden="true"></span><span><b>No video for this lesson yet</b>
      <small>Study the lesson explanation, examine the illustrations, and follow the worked example.</small></span></div>`;
  return `<div class="video ready"><span class="play" aria-hidden="true"></span><div><b>Supplementary video${list.length > 1 ? "s" : ""}</b>
      <ul class="vlist">${list.map(v => `<li><a href="${v.url}" target="_blank" rel="noopener">${v.title}</a>${v.source ? ` <small>(${v.source}, opens in a new tab)</small>` : ` <small>(opens in a new tab)</small>`}</li>`).join("")}</ul>
      <small>Watch after reading the lesson. Videos explain the same idea in another way.</small></div></div>`;
}

function lessonHTML(l, wk) {
  const fid = `fx-${l.id.replace(".", "-")}`;
  const figs = [].concat(l.figure || []);
  const fig = figs.map((f, j) => {
    const id = j ? `${fid}-${j}` : fid;
    if (f === "sorter" || f.startsWith("sorter:")) return sorterHTML(wk, f.split(":")[1]);
    if (IX[f]) return IX[f].html(id, l, wk);
    return FIG[f] ? FIG[f](id) : "";
  }).join("");
  const point = p => /^\s*<(table|div|ul|ol)/.test(p) ? p : `<p>${p}</p>`;
  return `<article class="lesson" id="l-${l.id.replace(".", "-")}" aria-labelledby="lh-${l.id.replace(".", "-")}">
    <div class="lesson-head"><span class="lesson-num">${l.id}</span><h3 id="lh-${l.id.replace(".", "-")}">${l.title}</h3></div>
    <p class="key"><b>Key idea.</b> ${l.key}</p>
    <div class="lesson-body"><div class="points">${l.points.map(point).join("")}</div>
      <div class="figwrap">${fig}</div></div>
    <div class="example"><span class="eyebrow">Worked example</span><p class="q">${l.example.q}</p>
      <ol>${l.example.steps.map(s => `<li>${s}</li>`).join("")}</ol></div>
    ${videoHTML(l)}
  </article>`;
}

// Sorting activity; Week 2 uses the defaults, other weeks set sorterCfg.
const sorterCfg = wk => Object.assign({ title: "Inductive or deductive?", labels: ["Inductive", "Deductive"], noun: "reasoning",
  hint: "Not quite. Ask yourself: is it based on examples, or on a known rule?" }, wk.sorterCfg || {});
function sorterHTML(wk, key) {
  const { cfg, items } = sorterData(wk, key), sid = `${wk.n}${key ? "-" + key : ""}`;
  return `<div class="explore sorter" data-sw="${wk.n}" data-sk="${key || ""}"><div class="explore-head"><span class="eyebrow">Try it</span><b>${cfg.title}</b></div>
    ${items.map((it, i) => `<div class="sort-item" data-sort="${i}"><p id="st-${sid}-${i}">${it.s}</p>
      <div class="row" role="group" aria-labelledby="st-${sid}-${i}">${cfg.labels.map(lb => `<button class="btn sm" type="button" data-pick="${lb}">${lb}</button>`).join("")}</div>
      <p class="fb" aria-live="polite"></p></div>`).join("")}</div>`;
}

function practiceHTML(wk) {
  const levels = ["Easy", "Average", "Difficult"];
  return levels.map(lv => `<div class="level"><h3 class="h4"><span class="lv lv-${lv.toLowerCase()}">${lv}</span></h3>
    ${wk.practice.map((p, i) => p.level !== lv ? "" : problemHTML(p, `p${wk.n}-${i}`, `data-prac="${wk.n}-${i}"`)).join("")}</div>`).join("");
}

function checkHTML(wk) {
  return `<form class="check" data-check="${wk.n}">
    ${wk.check.map((c, i) => `<fieldset class="check-item" data-ci="${i}"><legend id="cq-${wk.n}-${i}"><span class="qn" aria-hidden="true">${i + 1}</span><span><span class="sr-only">Question ${i + 1}. </span>${c.q}</span></legend>${mc(`c${wk.n}-${i}`, c.choices, `cq-${wk.n}-${i}`)}</fieldset>`).join("")}
    <p class="fb" data-check-msg aria-live="polite"></p>
    <div class="row"><button class="btn primary" type="submit">Submit my answers</button><button class="btn" type="button" data-retake="${wk.n}" hidden>Try again</button></div>
    <div class="next" data-next hidden></div>
  </form>`;
}

const LIGHTS = [["green", "I understand it and can explain it."], ["yellow", "I understand some of it."], ["red", "I'm having difficulty."]];
const NOTE_QS = [["learn", "What did I learn today?"], ["difficult", "Which concept was difficult for me?"], ["apply", "Where can I apply this mathematical concept?"]];

function reflectHTML(wk) {
  const saved = progress.rating(wk.n), notes = progress.notes(wk.n);
  return `<p class="q" id="exit-${wk.n}"><span class="eyebrow">Exit question</span><br>${wk.exitQ}</p>
    <form class="reflect" data-reflect="${wk.n}">
      <fieldset class="notes"><legend>My reflection <span class="muted">(optional)</span></legend>
        ${NOTE_QS.map(([k, q]) => `<label for="rf-${wk.n}-${k}">${q}</label>
          <textarea id="rf-${wk.n}-${k}" data-note="${k}" rows="3" maxlength="600">${(notes[k] || "").replace(/</g, "&lt;")}</textarea>`).join("")}
      </fieldset>
      <fieldset class="lights"><legend>How well do I understand this week's lessons?</legend>
        ${LIGHTS.map(([c, t]) => `<label class="light"><input type="radio" name="light-${wk.n}" value="${c}" ${saved === c ? "checked" : ""}><span class="dot dot-${c}" aria-hidden="true"></span>${t}</label>`).join("")}
      </fieldset>
      <p class="fb" data-light-msg aria-live="polite">${saved ? lightMsg(saved) : ""}</p>
      <div class="row"><button class="btn primary" type="submit">Save my reflection</button><button class="btn" type="button" data-copy-reflect="${wk.n}">Copy my reflection</button></div>
      <p class="fb" data-reflect-msg aria-live="polite"></p>
      <p class="muted small">Your reflection is saved only on this device. To send it to your teacher, tap <b>Copy my reflection</b> and paste it where your teacher asks.</p>
    </form>`;
}
function lightMsg(c) {
  return c === "green" ? "Great. Try the Difficult practice problems or the enrichment task."
    : c === "yellow" ? "Good start. Reread the key ideas, then redo the Easy and Average problems."
    : "That's okay. Tell your teacher which part is hard, and go over the worked examples again.";
}
function reflectionText(n, f) {
  const w = findWeek(n), get = k => ($(`[data-note="${k}"]`, f).value || "").trim() || "(no answer)";
  const pick = $(`input[name="light-${n}"]:checked`, f), light = pick ? LIGHTS.find(l => l[0] === pick.value)[1] : "(not rated)";
  return [`Math 9 Learning Hub, Week ${n} reflection`, `Exit question: ${w.exitQ.replace(/<[^>]+>/g, "")}`,
    ...NOTE_QS.map(([k, q]) => `${q} ${get(k)}`), `How well I understand: ${light}`].join("\n");
}

// ---------- interactions ----------
function findPractice(key) { const [wn, i] = key.split("-").map(Number); return findWeek(wn).practice[i]; }
function findWarm(key) { return findWeek(+key.replace(/^[a-z]+w/, "")).study.warm; }

document.addEventListener("submit", e => {
  const f = e.target;
  if (f.dataset.prac || f.dataset.warm) {
    e.preventDefault();
    const key = f.dataset.prac ? `p${f.dataset.prac}` : f.dataset.warm;
    const item = f.dataset.prac ? findPractice(f.dataset.prac) : findWarm(f.dataset.warm);
    const fb = $(`#fb-${key}`, f);
    let ok;
    if (item.choices) {
      const pick = $(`input[name="${key}"]:checked`, f);
      if (!pick) { fb.className = "fb no"; fb.textContent = "Pick an answer first."; return; }
      ok = +pick.value === item.ans;
    } else {
      const v = num($("input.ans", f).value);
      if (isNaN(v)) { fb.className = "fb no"; fb.textContent = "Type a number first."; return; }
      ok = Math.abs(v - item.ans) < 0.01;
    }
    fb.className = "fb " + (ok ? "ok" : "no");
    fb.textContent = ok ? "Correct. Nice work!" : "Not yet. Check your work and try again, or show the solution.";
  }
  if (f.dataset.check) {
    e.preventDefault();
    const n = +f.dataset.check, w = findWeek(n);
    const picks = w.check.map((c, i) => $(`input[name="c${n}-${i}"]:checked`, f));
    const msg = $("[data-check-msg]", f);
    if (picks.some(p => !p)) { msg.className = "fb no"; msg.textContent = "Answer all five questions first."; return; }
    let score = 0; const missed = [];
    w.check.forEach((c, i) => {
      const fs = $(`[data-ci="${i}"]`, f), ok = +picks[i].value === c.ans;
      if (ok) score++; else missed.push(c.lesson);
      fs.classList.toggle("right", ok); fs.classList.toggle("wrong", !ok);
      $$("label.choice", fs).forEach((lb, j) => lb.classList.toggle("is-answer", j === c.ans));
      $$("input", fs).forEach(inp => inp.disabled = true);
    });
    progress.set(s => { s.checks = s.checks || {}; s.checks[n] = score; });
    msg.className = "fb " + (score >= 4 ? "ok" : "no");
    msg.textContent = `You got ${score} out of 5.`;
    const nx = $("[data-next]", f); nx.hidden = false;
    const lessons = [...new Set(missed)].sort();
    nx.innerHTML = score >= 4
      ? `<span class="eyebrow">Next step · Target reached</span><h3>You met the weekly practice target (at least 4 out of 5).</h3>
         ${score === 5 ? "" : `<p>Look over the question you missed, then try this:</p>`}<p><b>Enrichment:</b> ${w.enrich}</p>
         <p class="muted small">This check is a quick practice snapshot, not a final grade. Your quizzes and tasks in class show your full progress.</p>`
      : `<span class="eyebrow">Next step · More practice recommended</span><h3>More practice recommended. Review these lessons:</h3>
         <div class="row">${lessons.map(id => `<button type="button" class="btn" data-goto="l-${id.replace(".", "-")}">Lesson ${id}</button>`).join("")}</div>
         <p>Reread the key idea and the worked example, redo the Easy and Average practice, then try the check again.</p>`;
    $("button[type=submit]", f).hidden = true; $("[data-retake]", f).hidden = false;
    nx.setAttribute("tabindex", "-1"); nx.focus();
  }
  if (f.dataset.reflect) {
    e.preventDefault();
    const n = +f.dataset.reflect, notes = {};
    $$("[data-note]", f).forEach(t => { notes[t.dataset.note] = t.value.trim(); });
    const pick = $(`input[name="light-${n}"]:checked`, f);
    const ok = progress.set(s => {
      s.notes = s.notes || {}; s.notes[n] = notes;
      if (pick) { s.reflect = s.reflect || {}; s.reflect[n] = pick.value; }
    });
    const m = $("[data-reflect-msg]", f);
    m.className = "fb " + (ok ? "ok" : "no");
    m.textContent = ok ? "Saved on this device." : "This browser is not allowing saving. Use Copy my reflection to keep your answers.";
  }
});

document.addEventListener("change", e => {
  const r = e.target;
  if (r.matches && r.matches('.lights input[type="radio"]')) {
    const n = +r.name.replace("light-", "");
    progress.set(s => { s.reflect = s.reflect || {}; s.reflect[n] = r.value; });
    const msg = $("[data-light-msg]", r.closest("form"));
    if (msg) msg.textContent = lightMsg(r.value);
  }
});

document.addEventListener("click", e => {
  const t = e.target.closest("button, a"); if (!t) return;
  if (t.dataset.show) {
    const s = $(`#sol-${t.dataset.show}`); s.hidden = !s.hidden;
    t.textContent = s.hidden ? "Show solution" : "Hide solution";
    t.setAttribute("aria-expanded", String(!s.hidden));
  }
  if (t.dataset.jump) $(`#sec-${t.dataset.jump}`)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  if (t.dataset.goto) { const el = $(`#${t.dataset.goto}`); if (el) { el.scrollIntoView({ block: "start" }); el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); } }
  if (t.dataset.pick) {
    const box = t.closest("[data-sort]"), sw = t.closest("[data-sw]"), wk = findWeek(+sw.dataset.sw);
    const { cfg, items } = sorterData(wk, sw.dataset.sk), it = items[+box.dataset.sort];
    const ok = t.dataset.pick === it.a, fb = $(".fb", box);
    fb.className = "fb " + (ok ? "ok" : "no");
    fb.textContent = ok ? (it.why ? `Correct. ${it.why}` : `Correct: ${it.a.toLowerCase()} ${cfg.noun}.`) : cfg.hint;
  }
  if (t.dataset.retake) {
    const n = +t.dataset.retake, f = t.closest("form");
    f.outerHTML = checkHTML(findWeek(n));
    $(`[data-check="${n}"] input`)?.focus();
  }
  if (t.dataset.copyReflect) {
    const f = t.closest("form"), text = reflectionText(+t.dataset.copyReflect, f), m = $("[data-reflect-msg]", f);
    const done = () => { m.className = "fb ok"; m.textContent = "Copied. Paste it where your teacher asks."; };
    const fail = () => { m.className = "fb no"; m.textContent = "Copy did not work in this browser. Select your answers and copy them yourself."; };
    try { navigator.clipboard.writeText(text).then(done, fail); } catch (_) { fail(); }
  }
  if (t.hasAttribute("data-clear-progress")) {
    const m = $("[data-clear-msg]");
    if (!progress.hasAny()) { m.className = "fb ok"; m.textContent = "There is no saved progress on this device."; return; }
    if (t.dataset.armed !== "1") {
      t.dataset.armed = "1"; t.textContent = "Yes, clear everything";
      m.className = "fb no"; m.textContent = "This removes all saved scores, ratings, and reflections on this device. Tap again to confirm.";
      return;
    }
    const ok = progress.clear();
    t.dataset.armed = ""; t.textContent = "Clear my progress";
    m.className = "fb " + (ok ? "ok" : "no");
    m.textContent = ok ? "Your progress on this device has been cleared." : "Could not clear progress in this browser.";
    $$(".pill.score").forEach(p => p.remove());
  }
});

document.addEventListener("input", e => {
  const ex = e.target.closest("[data-explore]"); if (ex) drawExplore(ex);
});

</script>

const STRAND = { geo: "Geometry and proof", alg: "Quadratics" };
const thisWeek = () => findWeek(SITE.cw);

const datesOf = w => w ? (scheduleDates(w.n) || w.dates || "") : "";
const weekDates = w => datesOf(w) || "Dates to be announced";

function buildNav() {
  const nav = $("#main-nav"), cw = thisWeek(), nw = nextWeek();

}

function termMap() {

  return `<nav class="map" aria-labelledby="map-h">
    <div class="map-head"><h2 class="h4" id="map-h">${SITE.term} at a glance</h2><span class="muted">Pick a week</span></div>

function route() {
  const h = location.hash.slice(1);
  const m = h.match(/^week-(\d+)$/);
  const n = m ? +m[1] : 0;
  const app = $("#app");
  app.innerHTML = n && findWeek(n) ? weekView(n) : homeView();
  $$("[data-explore]").forEach(drawExplore);
  initIX(app);
  if (typeof initHowTo === "function") initHowTo();
  const cw = SITE.cw;
  $$("#main-nav a").forEach(a => a.removeAttribute("aria-current"));
  const cur = n ? (n === cw ? "This week" : n === cw + 1 ? "Next week" : "") : "Home";
  $$("#main-nav a").forEach(a => { if (a.textContent === cur) a.setAttribute("aria-current", "page"); });
  document.title = n && findWeek(n) ? `Week ${n}: ${findWeek(n).short} · Math 9 Learning Hub` : "Math 9 Learning Hub · Siay NHS";
  window.scrollTo(0, 0);
  // Move keyboard and screen-reader focus to the new page heading.
  if (route.started) { const h1 = $("#app h1"); if (h1) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); } }
  route.started = true;
}
window.addEventListener("hashchange", route);

</script>

function weekView(n) {
  const w = findWeek(n), prev = findWeek(n - 1), next = findWeek(n + 1), cw = SITE.cw;
  const ready = w.status === "ready";
  const parts = ready ? [["study", "Study ahead"], ["learn", "Learn"], ["practice", "Practice"], ["check", "Check"], ["reflect", "Reflect"]] : [["study", "Study ahead"]];
  const withVid = ready ? w.lessons.filter(l => lessonVideos(l).length).length : 0;
  return `<section class="view week ${w.strand}" aria-labelledby="wk-h">
    <a class="back" href="#home">← All weeks</a>
    <header class="banner greenband">
      <span class="eyebrow">Week ${w.n} · ${STRAND[w.strand]} · ${weekDates(w)}${n === cw ? " · This week" : n === cw + 1 ? " · Next week" : ""}</span>
      <h1 id="wk-h">${w.title}</h1>
      <p>${SITE.term} · S.Y. ${SITE.schoolYear} · ${SITE.school}</p>
    </header>
    <div class="comp"><h2 class="h4">This week's learning competencies</h2><ol>${w.competencies.map((c, i) => `<li><span class="cn" aria-hidden="true">${i + 1}</span><span><span class="cl">Learning Competency ${i + 1}</span>${c}</span></li>`).join("")}</ol></div>
    ${w.note ? `<p class="note"><b>Session 4.</b> ${w.note}</p>` : ""}
    <nav class="parts" aria-label="Parts of this week">${parts.map(([id, t], i) => `<button type="button" class="part" data-jump="${id}"><span aria-hidden="true">${i + 1}</span>${t}</button>`).join("")}</nav>
    ${ready ? `<p class="muted small">Supplementary videos: ${withVid} of ${w.lessons.length} lessons. Every lesson can be learned from its explanation, illustrations, and worked example.</p>` : ""}
    <section class="block" id="sec-study" aria-labelledby="h-study"><h2 id="h-study"><span class="sn" aria-hidden="true">1</span>Study ahead</h2>${studyHTML(w, "s")}</section>
    ${ready ? `
    <section class="block" id="sec-learn" aria-labelledby="h-learn"><h2 id="h-learn"><span class="sn" aria-hidden="true">2</span>Learn</h2>${w.lessons.map(l => lessonHTML(l, w)).join("")}</section>
    <section class="block" id="sec-practice" aria-labelledby="h-practice"><h2 id="h-practice"><span class="sn" aria-hidden="true">3</span>Practice</h2><p class="muted">Type a number or pick an answer. Units are already shown.</p>${practiceHTML(w)}</section>
    <section class="block" id="sec-check" aria-labelledby="h-check"><h2 id="h-check"><span class="sn" aria-hidden="true">4</span>Check</h2><p class="muted">Five questions from this week. Getting at least 4 right (80%) meets the weekly practice target. It is practice, not a final grade.</p>${checkHTML(w)}</section>
    <section class="block" id="sec-reflect" aria-labelledby="h-reflect"><h2 id="h-reflect"><span class="sn" aria-hidden="true">5</span>Reflect</h2>${reflectHTML(w)}</section>`
    : `<section class="block soon"><h2>Lessons coming soon</h2><p>The full lessons, practice, and check for this week are being added. For now, use the study-ahead material above to get ready.</p></section>`}
    <nav class="pager" aria-label="Other weeks">${prev ? `<a class="btn" href="#week-${prev.n}">← Week ${prev.n}</a>` : "<span></span>"}${next ? `<a class="btn" href="#week-${next.n}">Week ${next.n} →</a>` : ""}</nav>
  </section>`;
}

function footerHTML() {
  return `<div class="weave-strip" aria-hidden="true"></div>
    <p><b>Math 9 Learning Hub</b> · ${SITE.grade} ${SITE.subject} · ${SITE.school}, ${SITE.place} · S.Y. ${SITE.schoolYear}, ${SITE.term} · Version ${SITE.version}, last updated ${SITE.lastUpdated}.</p>
    <p>Lessons are adapted from the Term 2 lesson plans (LPTs) and slides prepared by Grade 9 Mathematics teachers. Maintained by ${SITE.teacher}.</p>
    <p><b>Privacy.</b> There is no login, and this site has no database. Your answers, Check scores, self-ratings, and reflections are never sent to a server or to your teacher; they stay in this browser on this device until you clear them. Opening the site makes ordinary web requests (to the website host and to Google Fonts for the lettering), the same as visiting any web page. Supplementary video links open Khan Academy or YouTube, which have their own privacy policies.</p>`;
}

// "Skip to main content" moves focus without changing the page address.
$(".skip-link").addEventListener("click", e => {
  e.preventDefault();
  const target = $("#app h1") || $("#app");
  target.setAttribute("tabindex", "-1"); target.focus();
});

SITE.cw = currentWeekNo();
HUB.weeks.sort((a, b) => a.n - b.n);
buildNav();
$("#site-footer").innerHTML = footerHTML();
route();

// "New here?" panel on the home page. Open until the learner closes it once.
function howToHTML(cw) {
  let closed = false;
  try { closed = localStorage.getItem("m9-howto") === "closed"; } catch (_) { }
  const wk = cw ? `<b>Open Week ${cw.n}</b> below` : "the week you need under <b>All weeks</b>";
  return `<details class="panel howto" id="howto"${closed ? "" : " open"}>
    <summary><span class="eyebrow">New here?</span><span class="howto-title">How to use the hub</span><span class="howto-hint" aria-hidden="true"></span></summary>
    <div class="howto-body">
      <ol class="howto-steps">
        <li><b>Find this week.</b> Tap <b>This week</b> in the top menu, or ${wk}. Missed a week? Scroll down to <b>All weeks</b>.</li>
        <li><b>Study ahead</b> before class: refresh, learn the words to know, and try the warm-up.</li>
        <li><b>Learn.</b> Read the key idea and the worked example. In every <b>Try it</b> box, move the sliders and tap the buttons.</li>
        <li><b>Practice</b> from Easy to Average to Difficult. Answer first, then tap <b>Show solution</b>.</li>
        <li><b>Check and reflect.</b> Answer the five-item Check, tap <b>Submit my answers</b>, then write your reflection.</li>
      </ol>
      <ul class="howto-tips">
        <li><b>One tap next time:</b> in Chrome, tap <b>⋮</b> then <b>Add to Home screen</b>.</li>
        <li><b>No internet at home?</b> Tap <b>Download offline copy</b> further down this page while you have data or Wi-Fi.</li>
        <li><b>Shared phone?</b> Tap <b>Clear my progress</b> when you finish.</li>
      </ul>
      <div class="row howto-vids" data-howto-vids hidden>
        <a class="btn primary" href="quick-start.mp4" target="_blank" rel="noopener" data-vid="quick-start.mp4">▶ Quick start (1 minute)</a>
        <a class="btn" href="how-to-use-hub.mp4" target="_blank" rel="noopener" data-vid="how-to-use-hub.mp4">▶ Full guide (6 minutes)</a>
      </div>
    </div>
  </details>`;
}
// Remember when the panel is closed; show the video buttons only when the videos are on the site.
function initHowTo() {
  const d = $("#howto"); if (!d) return;
  d.addEventListener("toggle", () => { try { localStorage.setItem("m9-howto", d.open ? "open" : "closed"); } catch (_) { } });
  const box = $("[data-howto-vids]", d);
  if (!box || location.protocol === "file:" || window.OFFLINE_BUILD || !window.fetch) return;
  $$("[data-vid]", box).forEach(a => {
    fetch(a.dataset.vid, { method: "HEAD" }).then(r => { if (r.ok) { box.hidden = false; } else a.remove(); }).catch(() => a.remove());
  });
}

</script>
